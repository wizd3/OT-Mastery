core:`<p><b>Cloud and edge.</b> Prefer outbound-only connections from an edge gateway or DMZ, data replicated rather than live access to control networks, device identity through certificates and strong key handling, and no cloud path to write to controllers unless risk accepted and strongly controlled.</p><p><b>Wireless.</b> Use 802.1X with strong enterprise authentication, segment wireless from control networks, survey coverage, detect rogue access points, and apply the protocol security of industrial wireless such as WirelessHART. Private cellular is emerging in industrial settings and needs its own risk review.</p><p><b>IIoT devices.</b> Check update support, default credentials, cloud dependencies and vendor lifecycle before purchase.</p><h2>Common mistakes</h2><p>Vendor cloud connections added without review, and flat wireless with a shared key.</p>`,
exp:"Ask what leaves OT, what can enter, who controls the keys and what happens when the cloud is unavailable.",
quiz:[["Preferred cloud data flow:",["Inbound to PLCs","Outbound-only replication","Open port","Shared password"],1,"It limits inbound attack paths."],["Industrial Wi-Fi should use:",["Shared key","802.1X enterprise authentication","Open access","WEP"],1,"Per-user or per-device authentication is stronger."],["Before buying IIoT devices check:",["Color","Update support and lifecycle","Packaging","Logo"],1,"Long-term security depends on vendor support."]],
ex:"Review a proposed predictive maintenance cloud service: map the data flows, list five risks and define conditions for approval."},
"4-8":{why:"Security and safety must support each other. Poorly coordinated changes can harm either.",
obj:["Relate functional safety and cybersecurity lifecycles","Include cyber scenarios in hazard analysis","Govern changes affecting safety functions"],
core:`<p>Functional safety standards (IEC 61508 for the general framework and IEC 61511 for the process sector) manage the safety lifecycle, from hazard analysis to operation and change. Hazard studies such as HAZOP and layers of protection analysis assume protection layers fail only at stated rates. A cyber attack can defeat several layers at once, because they share networks, workstations or credentials.</p><p><b>Integration.</b> Add a security review to hazard studies, identify credible cyber scenarios for each hazard, check independence of the SIS from the control network, and apply management of change to any security change near safety functions.</p><h2>Common mistakes</h2><p>Treating security as outside safety scope, and approving security tools on SIS-adjacent networks without functional safety review.</p>`,
exp:"Ask the safety team which assumptions of independence an attacker could break. That list drives your highest-priority controls. Confirm the exact guidance documents with the standards bodies before citing them.",
quiz:[["IEC 61511 applies to:",["Building HVAC","Process industry functional safety","Printers","Cloud billing"],1,"It addresses safety instrumented systems in process plants."],["A cyber attack can undermine safety by:",["Nothing","Defeating assumed independent layers","Slowing email","Changing logos"],1,"Shared paths weaken independence."],["SIS-adjacent security changes require:",["Nothing","Management of change with safety review","Only IT approval","A holiday"],1,"They can affect safety function behavior."]],
ex:"For one hazard scenario, list three cyber paths that could defeat protection layers and the controls and safety reviews needed."},
"4-9":{why:"Suppliers, integrators and service providers hold privileged access and build the systems you run.",
obj:["Tier suppliers by risk","Write security terms for contracts","Verify supplier assurance"],
core:`<p>Tier suppliers by access and consequence: remote access to control systems, supply of critical components and software, and managed services rank highest. Contract terms can cover vulnerability disclosure and patch timelines, remote access rules, incident notification, software bills of materials, background checks for staff and the right to assess. IEC 62443-2-4 addresses security capabilities of service providers.</p><p><b>Verification.</b> Review evidence of lifecycle practices, test deliverables at FAT and SAT, verify signed software and checksums, review supplier remote sessions and remove accounts at contract end. Secure commissioning and decommissioning wipe or retire credentials, configurations and devices.</p><h2>Common mistakes</h2><p>Questionnaires with no evidence, standing vendor accounts and no plan for supplier compromise.</p>`,
exp:"Assume a supplier will be compromised and design so that a single supplier credential does not give broad access.",
quiz:[["Highest-risk supplier type:",["Stationery","Remote access to control systems","Catering","Cleaning"],1,"Privileged access to OT carries the most risk."],["An SBOM lists:",["Software components","Employees","Prices","Hardware colors"],0,"It helps track vulnerable components."],["At contract end you should:",["Keep accounts","Remove access and credentials","Share keys","Ignore"],1,"Dormant access is a common exposure."]],
ex:"Level 4 completion: finish all nine modules, score at least 80 percent on knowledge checks, produce a 62443-3-2 zone design, an assessment report with roadmap and a supplier security clause set. Then mark modules complete."}
});
Object.assign(BODY,{
"5-1":{why:"Technical controls decay without ownership, funding and a repeatable management system. Strategy makes security durable.",
obj:["Design an OT security governance model","Define roles, policies and decision rights","Build a funded multi-year roadmap"],
core:`<p><b>Governance elements.</b> A charter approved by senior leadership, a steering group spanning IT, OT, engineering, safety and operations, and a policy hierarchy of policy, standards and procedures. IEC 62443-2-1 (edition 2, published 2024) sets security program requirements for asset owners and includes a maturity model for evaluating them, which fits this role.</p><p><b>Operating model.</b> Centralized (one team sets and runs controls), federated (sites run controls to central standards) or hybrid. Hybrid is common: central standards, architecture and monitoring, with site ownership of operations and change.</p><p><b>Roles.</b> Name accountable owners for each asset class, remote access approval, exceptions, incident decisions and supplier access. Use a RACI table so every control has one accountable owner.</p><p><b>Roadmap.</b> Sequence work by risk reduction and dependency: visibility and access control first, then segmentation, recovery, detection and continuous improvement, aligned to outage windows and budget cycles.</p><h2>Common mistakes</h2><p>A program owned only by IT, policies that plants cannot follow, and no exception process, which pushes workarounds underground.</p>`,
exp:"Win plant managers by showing that security helps reliability and recovery. Programs succeed when site leaders see them as their own.",
quiz:[["Hybrid operating model means:",["Everything central","Central standards with site operation","No standards","Vendor only"],1,"It balances consistency with site ownership."],["Every control should have:",["Many owners","One accountable owner","No owner","A vendor owner"],1,"Single accountability prevents gaps."],["Early roadmap priorities:",["AI","Visibility and access control","Quantum","Branding"],0+1,"Knowing assets and controlling access reduce the most risk soonest."]],
ex:"Draft a RACI for ten OT security activities and a three-year roadmap with dependencies for a company of five plants."},
"5-2":{why:"Leaders fund what they can compare to other risks. Translating technical findings into safety, operational and financial terms secures decisions.",
obj:["Build scenario-based risk estimates","Translate findings into consequence categories","Choose risk treatment options"],
core:`<p><b>Scenario method.</b> Define a scenario (for example ransomware halts a line), estimate how often it could occur as a range, estimate loss as a range by category (production loss, recovery cost, safety and environmental impact, penalties, reputation), and record assumptions. Methods such as FAIR give structure to frequency and loss estimates. Ranges are honest; single numbers imply false precision.</p><div class="scroll"><table><tr><th>Illustrative fictional scenario</th><th>Estimate</th></tr><tr><td>Line 3 halted by ransomware</td><td>Occurs 1 in 10 to 1 in 20 years</td></tr><tr><td>Downtime</td><td>2 to 5 days</td></tr><tr><td>Loss per day</td><td>0.8 to 1.2 million (currency units)</td></tr><tr><td>Recovery and response</td><td>0.3 to 0.6 million</td></tr></table></div><p><b>Treatment.</b> Mitigate with controls, accept with approval at the right level, transfer part through insurance (check exclusions and requirements), or avoid by changing the process. Compare control cost with the reduction in expected loss and in worst-case exposure.</p><h2>Common mistakes</h2><p>Using IT breach cost figures for plant outages, ignoring safety consequences because they are hard to price, and presenting precise numbers built on guesses.</p>`,
exp:"Safety and environmental consequences are often non-negotiable limits rather than costs to trade. State them as thresholds that risk acceptance cannot cross.",
quiz:[["Why estimate ranges?",["Look scientific","Reflect uncertainty honestly","Save time","Required by law"],1,"Ranges avoid false precision."],["Risk transfer commonly means:",["Insurance or contracts","Deleting risk","Ignoring","Encryption"],0,"It shifts part of the financial impact, not the operational risk."],["Safety impacts in risk acceptance are:",["Priced and traded","Often treated as limits","Ignored","Equal to cost"],1,"Unacceptable harm is not offset by savings."]],
ex:"Build a one-page risk estimate for a scenario in your plant with ranges, assumptions, treatment options and a recommendation."},
"5-3":{why:"What you measure shapes behavior. Good measures show progress and risk, and weak ones reward activity.",
obj:["Use maturity models to benchmark and plan","Select KPIs and KRIs","Report metrics without gaming"],
core:`<p><b>Maturity models.</b> Examples include the Cybersecurity Capability Maturity Model (C2M2), NIST CSF implementation tiers and 62443-based maturity levels. They help compare capabilities across sites and plan progress; they do not prove a lack of risk.</p><div class="scroll"><table><tr><th>KPI (performance)</th><th>KRI (risk exposure)</th></tr><tr><td>Share of assets in inventory with an owner</td><td>Internet-exposed OT devices not in scope of a control</td></tr><tr><td>Vulnerabilities addressed within agreed time</td><td>Overdue exceptions and compensating controls</td></tr><tr><td>Backup restore tests passed</td><td>Critical systems with no tested restore</td></tr><tr><td>Remote sessions with MFA and approval</td><td>Vendor accounts with no expiry date</td></tr><tr><td>Time to triage OT alerts</td><td>Critical zones with no monitoring</td></tr></table></div><h2>Common mistakes</h2><p>Counting alerts or patches without a risk link, targets that encourage hiding problems, and benchmarks across sites that measure different things.</p>`,
exp:"Pair each KPI with the risk it controls and name a threshold that triggers action. Review metric definitions annually.",
quiz:[["A KRI tracks:",["Effort","Risk exposure","Costs only","Training hours"],1,"It shows where exposure is rising."],["Maturity scores:",["Prove safety","Support planning and comparison","End audits","Replace risk work"],1,"They guide improvement but are not proof of security."],["Gaming metrics is reduced by:",["Bigger targets","Clear definitions and risk-linked thresholds","Secrecy","More dashboards"],1,"Defined, risk-related measures resist manipulation."]],
ex:"Create a one-page dashboard of six KPIs and four KRIs, with owner, source, frequency and trigger threshold for each."},
"5-4":{why:"Obligations differ by country, sector and contract, and misreading them leads to wasted spend or missed duties.",
obj:["Identify which regimes may apply to an organization","Distinguish law, regulation, contract and guidance","Plan evidence for compliance"],
core:`<div class="scroll"><table><tr><th>Example regime</th><th>Typical reach</th></tr><tr><td>NERC CIP</td><td>Bulk electric system in North America</td></tr><tr><td>EU NIS2 Directive</td><td>Essential and important entities in many sectors across the EU, binding through national law (in force January 2023; transposition was due 17 October 2024 and many Member States were late)</td></tr><tr><td>US pipeline security directives</td><td>Designated pipeline operators</td></tr><tr><td>Saudi NCA OTCC-1:2022</td><td>OT and ICS environments of organizations in scope of the NCA in Saudi Arabia; extends ECC-1:2018 (see the OTCC page)</td></tr><tr><td>National OT or critical infrastructure frameworks</td><td>Defined by each country and sector authority</td></tr><tr><td>Customer or insurer requirements</td><td>Binding through contract</td></tr></table></div><p><b>Method.</b> Identify jurisdictions and sectors, confirm the applicable instrument and its current version with the regulator or counsel, map requirements to your control set, collect evidence and track reporting duties such as incident notification times. Standards like 62443 are voluntary unless a law or contract adopts them.</p><h2>Common mistakes</h2><p>Treating guidance as law, assuming a regime applies by reputation, and working from outdated versions.</p>`,
exp:"Build one control framework mapped to several regimes, so you collect evidence once and answer many auditors. Confirm legal applicability with counsel.",
quiz:[["A voluntary standard becomes binding when:",["Never","A law or contract adopts it","It is popular","A vendor says so"],1,"Adoption through law or contract creates obligation."],["First step in regulatory mapping:",["Buy tools","Identify jurisdiction and sector applicability","Hire","Audit"],1,"Applicability determines everything else."],["Why map once to many regimes?",["Collect evidence once","Avoid reading","Skip counsel","Raise cost"],0,"A unified control set reduces repeated effort."]],
ex:"For an operator with plants in two countries, list the regimes that may apply, who confirms them and the shared control evidence."},
"5-5":{why:"Zero Trust, software-defined networking and secure-by-design are strategic directions, but OT constraints change how they apply.",
obj:["Apply Zero Trust principles to OT realistically","Assess software-defined networking in industrial settings","Use secure-by-design criteria in procurement"],
core:`<p><b>Zero Trust.</b> NIST SP 800-207 describes principles such as no implicit trust from network location, per-request access decisions and continuous verification. In OT this means strong identity at boundaries, microsegmentation of cells, device identity where devices support it, and least privilege for sessions. Legacy controllers cannot authenticate, so the surrounding network must enforce policy for them.</p><p><b>Software-defined networking</b> centralizes policy and can ease segmentation, but a controller outage or misconfiguration affects determinism and availability, so test failure modes before use in control networks.</p><p><b>Secure by design.</b> Favor vendors that ship secure defaults, support strong authentication, publish vulnerability processes and provide long-term support. Include these in tender criteria.</p><h2>Common mistakes</h2><p>Buying Zero Trust as a product, applying cloud patterns to controllers and ignoring failure behavior of central policy engines.</p>`,
exp:"Treat Zero Trust as a direction to reduce implicit trust step by step, starting with remote access and high-consequence zones.",
quiz:[["Zero Trust means:",["Trust inside network","No implicit trust by location","No security","Cloud only"],1,"Each access is verified."],["SDN risk in OT:",["None","Controller failure affecting availability","Lower cost","More cables"],1,"Central control adds a dependency that must fail safely."],["Legacy PLCs in Zero Trust rely on:",["Their own auth","Surrounding network enforcement","Nothing","Wi-Fi"],1,"The network and boundaries enforce policy."]],
ex:"Define a Zero Trust roadmap for remote access and one high-consequence zone with three phases and failure-mode tests."},
"5-6":{why:"Emerging technologies bring real benefits and real hype. Leaders need to separate what is deployed from what is speculative.",
obj:["Classify technologies by maturity","Identify risks and adoption conditions","Plan for cryptographic transition"],
core:`<div class="scroll"><table><tr><th>Technology</th><th>Maturity today</th><th>Notes</th></tr><tr><td>Anomaly detection in OT monitoring</td><td>Deployed</td><td>Learns baselines; needs tuning and operational context</td></tr><tr><td>Digital twins for design and training</td><td>Deployed in many sectors</td><td>Twin data and connections need the same protection as the plant</td></tr><tr><td>AI assistants for analysts</td><td>Early adoption</td><td>Check data exposure, accuracy and human review</td></tr><tr><td>Autonomous AI response in OT</td><td>Speculative</td><td>Safety and determinism risks are unresolved</td></tr><tr><td>Post-quantum cryptography</td><td>Standards published, migration beginning</td><td>Long-lived OT devices need inventory and planning</td></tr></table></div><p>NIST published its first post-quantum standards in 2024. Because OT equipment can remain in service for decades, start by inventorying cryptography in devices, certificates and protocols, favor vendors with a migration path and prefer crypto-agile designs.</p><h2>Common mistakes</h2><p>Treating vendor demos as proof, connecting twins and AI services to control networks without review, and ignoring long-lived certificates.</p>`,
exp:"Ask for evidence of deployment in comparable plants, failure behavior and who is accountable when the system acts wrongly.",
quiz:[["Autonomous AI response in OT is:",["Mature","Speculative","Required","Standard"],1,"Safety and determinism concerns remain."],["Why does PQC matter for OT?",["Short lifecycles","Long equipment life","No crypto","Cheap"],1,"Devices installed now may outlive current algorithms."],["First PQC step:",["Replace all","Inventory cryptography","Wait","Ignore"],1,"You cannot plan a migration without knowing what exists."]],
ex:"Evaluate one emerging technology for your plant using maturity, benefits, risks, prerequisites and a pilot plan."},
"5-7":{why:"When a major incident hits, organizational readiness matters more than any single control.",
obj:["Design a crisis management structure","Set recovery objectives per process","Run a progressive exercise program"],
core:`<p><b>Crisis structure.</b> A crisis lead, an operations and safety lead, a technical response lead, legal and regulatory liaison, communications and a scribe. Pre-agreed decision rights cover isolating sites, shutting processes, notifying authorities and paying or refusing demands.</p><p><b>Continuity.</b> Business impact analysis sets recovery time and recovery point objectives per process, and identifies manual operating modes, spare equipment, offline procedures and vendor support contacts.</p>${chain(["Tabletop discussion","Functional drill of one capability","Joint IT, OT and safety exercise","Live restore test"],[2],"Exercise program progression")}<h2>Common mistakes</h2><p>Plans that live only on systems that will be down, exercises limited to IT, and no practice of manual operation.</p>`,
exp:"The best predictor of recovery is a tested restore and a rehearsed decision chain. Keep paper copies of critical contacts and procedures.",
quiz:[["RTO means:",["Time to recover a service","Regional office","Root test","Risk tier"],0,"It is the target time to restore."],["Plans should be available:",["Only online","Offline as well","Never","Only to IT"],1,"They must work when systems are down."],["Best exercise participants:",["IT only","IT, OT, safety and leadership","Vendors only","Nobody"],1,"Crises cut across all functions."]],
ex:"Write a crisis role card set and RTO table for three critical processes, then design a joint tabletop exercise."},
"5-8":{why:"The final skill is persuading leaders to act. This module also closes the program with a capstone.",
obj:["Structure executive and board briefings","Answer difficult questions credibly","Complete the capstone program design"],
core:`<p><b>Briefing structure.</b> State the situation in one sentence, the risk in business and safety terms, the options with cost and effect, your recommendation and the decision you need. Use plain language, one or two numbers and a single diagram.</p><p><b>Board questions to prepare for:</b> are we exposed to a repeat of a public incident, how long to recover, what do regulators expect, how do we compare with peers, what will it cost and what happens if we delay.</p><p><b>Credibility.</b> Separate facts, estimates and opinions, state uncertainty, and follow up with promised data.</p><h2>Capstone</h2><p>Design a program for a fictional multi-site operator: governance, zone and conduit architecture, assessment findings, risk estimates, roadmap and a five-minute board briefing.</p><h2>Common mistakes</h2><p>Technical detail overload, fear-based messaging, and bringing problems without options.</p>`,
exp:"Leaders remember one clear risk, one decision and one commitment. Aim for that.",
quiz:[["A briefing should end with:",["A glossary","The decision needed","Packet captures","An apology"],1,"Leaders need a clear ask."],["Credibility improves when you:",["Hide uncertainty","State uncertainty and facts separately","Use jargon","Use fear"],1,"Transparency builds trust."],["Capstone output includes:",["A board briefing","A holiday plan","A vendor list only","Nothing"],0,"It tests communication as well as design."]],
ex:"Level 5 completion: finish all eight modules, score at least 80 percent on knowledge checks and submit the capstone package: program design, risk estimates, roadmap and a board briefing. Then mark modules complete."}

oftware bill of materials listing the components in a product."],["SCADA","Supervisory control and data acquisition for geographically spread assets."],["Security level (SL)","IEC 62443 measure of protection against increasingly capable attackers; SL-T target, SL-C capability, SL-A achieved."],["SIS","Safety instrumented system that drives the process to a safe state independently of the BPCS."],["SIL","Safety integrity level, a target for a safety function's reliability."],["SPAN and tap","Ways to copy network traffic to a monitoring tool, by switch mirror or inline device."],["Allowlisting","Permitting only approved software to run."],["Zone","A group of assets that share security requirements."]];

ased; the former contractor was convicted and sentenced to two years in prison in 2001","Authentication on telemetry, insider controls, logging","Which insider controls apply to contractors?","<a href=\"https://apps.dtic.mil/sti/pdfs/AD1107275.pdf\" target=\"_blank\" rel=\"noopener\">MITRE case study (Abrams and Weiss)</a>; <a href=\"https://attack.mitre.org/campaigns/C0020\" target=\"_blank\" rel=\"noopener\">MITRE ATT&amp;CK campaign C0020</a>"],["Norsk Hydro 2019","Publicly reported","Aluminium","Ransomware across the corporate network; plants moved to manual operation","Production disruption and manual operation; reported costs in the tens of millions of US dollars, with estimates differing by source","Manual procedures, backups, crisis communication","What manual modes did plants rely on?","<a href=\"https://cyote.inl.gov/content/uploads/24/2025/12/CyOTE-Case-Study_Norsk-Hydro.pdf\" target=\"_blank\" rel=\"noopener\">INL CyOTE case study</a> (2022): spearphishing entry, LockerGoga, recovery began about four weeks after the attack; <a href=\"https://www.businessinsurance.com/hydro-expects-cyberattack-costs-of-nearly-52-million-in-2019-first-quarter/\" target=\"_blank\" rel=\"noopener\">Reuters report on first-quarter costs</a>"],["Vendor remote access compromise","Fictional training scenario","Water utility","Standing vendor VPN with shared password leads to HMI access","Unauthorized valve commands","Brokered MFA access, session recording","Design the vendor access path."],["USB-borne EWS infection","Fictional training scenario","Manufacturing","Contractor USB drive infects the engineering workstation","Line stoppage and logic uncertainty","Media scanning kiosk, allowlisting, logic backups","How do you prove logic is clean?"],["Flat-network ransomware","Fictional training scenario","Food processing","IT compromise spreads to SCADA servers on a flat network","Production halt for days","Segmentation, offline backups, recovery drills","Where do you cut first?"],["S standards:()=>`<h1>Standards and sources</h1><p>Verification status is stated per item. Standards text is not reproduced.</p>${tbl(["Reference","Status checked","Source"],[["NIST SP 800-82 Rev. 3, Guide to OT Security","Verified: final, published September 2023, supersedes Rev. 2","<a href=\"https://csrc.nist.gov/pubs/sp/800/82/r3/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov</a>"],["MITRE ATT&CK, including ICS","Verified: v20 released 13 October 2026 is current; re-check tactic and technique names there, as the ICS lists in lessons may have changed","<a href=\"https://attack.mitre.org/resources/updates/\" target=\"_blank\" rel=\"noopener\">attack.mitre.org</a>"],["IEC 62443-2-1 (asset owner security program)","Verified: Edition 2 published 7 August 2024 (ANSI/ISA-62443-2-1-2024 also current); it adds a maturity model","<a href=\"https://genorma.com/en/standards/iec-62443-2-1-2024-ed2\" target=\"_blank\" rel=\"noopener\">genorma.com</a> and ISA"],["IEC 62443-3-3 (system requirements, security levels)","Verified at the IEC webstore: Edition 1.0, 7 August 2013, stability date 2027; secondary sources report a second edition in development","<a href=\"https://webstore.iec.ch/en/publication/7033\" target=\"_blank\" rel=\"noopener\">IEC webstore</a>"],["IEC 62443-4-2 (component requirements)","Verified at the IEC webstore: Edition 1.0, 27 February 2019, stability date 2027. A circulating claim of a 2026 edition was not confirmed","<a href=\"https://webstore.iec.ch/en/publication/34421\" target=\"_blank\" rel=\"noopener\">IEC webstore</a>"],["IEC 62443-2-4 (service providers)","Verified at the IEC webstore: Edition 2.0, 15 December 2023. ISA's catalog may still list the earlier edition, so check which one a contract cites","<a href=\"https://webstore.iec.ch/en/publication/67631\" target=\"_blank\" rel=\"noopener\">IEC webstore</a>"],["IEC 62443-3-2 (risk assessment, zones and conduits) and 4-1 (secure development lifecycle)","Consistent across several secondary sources: 3-2 published 2020 and 4-1 published 2018, both Edition 1.0. Not checked at the IEC webstore","<a href=\"https://www.bdemerson.com/article/iec-62443\" target=\"_blank\" rel=\"noopener\">Summary of parts and editions</a>"],["IEC 62443-1-1 (terminology, concepts, models)","Verified at the IEC webstore: IEC TS 62443-1-1:2009, Edition 1.0, a Technical Specification published 30 July 2009","<a href=\"https://webstore.iec.ch/en/publication/7029\" target=\"_blank\" rel=\"noopener\">IEC webstore</a>"],["NCA OTCC-1:2022 (Saudi Arabia)","Verified: issued by the NCA in April 2022 as an extension of ECC-1:2018; see the OTCC page for structure and mapping","<a href=\"https://nca.gov.sa/en/pages/otcc.html\" target=\"_blank\" rel=\"noopener\">nca.gov.sa</a>"],["NIST CSF 2.0","Verified: released 26 February 2024, six functions including Govern, voluntary (confirmed via secondary sources; primary page at nist.gov)","<a href=\"https://www.huntonprivacyblog.com/2024/03/04/nist-releases-cybersecurity-framework-2-0/\" target=\"_blank\" rel=\"noopener\">Hunton summary</a> and nist.gov/cyberframework"],["NIST SP 800-61 Rev. 3 (incident response)","Verified: final April 2025, supersedes Rev. 2 (2012); its life cycle model now follows the CSF 2.0 functions","<a href=\"https://csrc.nist.gov/pubs/sp/800/61/r3/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov</a>"],["NIST SP 800-53 Rev. 5","Verified: published September 2020; minor Release 5.2.0 issued 27 August 2025","<a href=\"https://csrc.nist.gov/Pubs/sp/800/53/r5/upd1/Final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov</a>"],["NIST SP 800-207 (Zero Trust Architecture)","Verified: published August 2020; the page carries a planning note dated April 2024, so check for a revision","<a href=\"https://csrc.nist.gov/pubs/sp/800/207/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov</a>"],["ISO/IEC 27001 and 27002","Verified: ISO/IEC 27001:2022 published 25 October 2022 with Amendment 1:2024 (climate action); ISO/IEC 27002:2022 published 15 February 2022 (the latter via secondary sources)","<a href=\"https://www.iso.org/standard/88435.html\" target=\"_blank\" rel=\"noopener\">iso.org</a>"],["IEC 61511-1 and IEC 61508","Partly verified: IEC 61511-1 Edition 2 (2016, Amendment 1 in 2017) and IEC 61508 second edition (2010) appear as current in standards catalogs; a newer 61511 edition may be in progress. Confirm at the IEC webstore","IEC webstore"],["NIST SP 800-30 Rev. 1 (risk assessments)","Verified: final September 2012, supersedes the 2002 edition; no later revision indicated","<a href=\"https://csrc.nist.gov/pubs/sp/800/30/r1/final\" target=\"_blank\" rel=\"noopener\">csrc.nist.gov</a>"],["ISO 31000:2018 (risk management guidelines)","Verified: Edition 2, February 2018; confirmed in a 2023 review and listed as to be revised","<a href=\"https://www.iso.org/standard/65694.html\" target=\"_blank\" rel=\"noopener\">iso.org</a>"],["CISA ICS alerts and advisories","Verified: ICS-ALERT-14-176-02A and ICSA-14-178-01 are live on cisa.gov and are used in the Havex case","<a href=\"https://cisa.gov/news-events/ics-advisories/icsa-14-178-01\" target=\"_blank\" rel=\"noopener\">cisa.gov</a>"],["Protocol matrix ports","Checked against the IANA registry: EtherNet/IP 44818 and 2222 (2221 for TLS and DTLS), BACnet 47808, IEC 104 2404, DNP3 20000 (secure 19999), OPC UA 4840. Not re-checked: Modbus 502, MQTT 1883 and 8883, MMS 102, SNMP, NTP, PTP, and the security feature columns","<a href=\"https://www.iana.org/assignments/service-names-port-numbers\" target=\"_blank\" rel=\"noopener\">iana.org</a>"],["5.4 regulatory table","NIS2 verified: Directive (EU) 2022/2555, in force 16 January 2023, transposition due 17 October 2024, binding through national law. NERC CIP, pipeline directives and national frameworks are general descriptions and were not source-checked","<a href=\"https://enisa.europa.eu/sites/default/files/2024-10/presentation-nis2-cybersecurity-conference-brussels-1.pdf\" target=\"_blank\" rel=\"noopener\">ENISA presentation</a>"]])}<p>Applicability to a given organization depends on jurisdiction, sector and contract.</p>`,
cases:()=>`<h1>Case library</h1><p>${CASES.length} cases. Fictional scenarios are labeled and are not real incidents. Real-case details are from public reporting at summary level and need source links before formal use.</p><div class="row" role="group" aria-label="Filter cases">${[["all","All"],["Real","Real"],["Publicly","Publicly reported"],["Fictional","Fictional"]].map(f=>`<button class="btn" data-f="${f[0]}" aria-pressed="${caseF===f[0]}">${f[1]}</button>`).join("")}</div><div id="cl" style="margin-top:12px">${caseList()}</div>`,
toolkit:()=>`<h1>Audit toolkit</h1><h2>Assessment checklist</h2><div class="card">${CK.map((t,i)=>`<label style="display:flex;gap:10px;margin:6px 0"><input type="checkbox" data-c="${i}" ${S.chk[i]?"checked":""}> <span>${t}</span></label>`).join("")}<p class="pct" id="cp">${Object.keys(S.chk).filter(k=>S.chk[k]).length} of ${CK.length} reviewed</p></div><h2>Risk rating</h2><div class="card"><div class="row"><label>Likelihood <select id="rl">${opt(3)}</select></label><label>Consequence <select id="rc">${opt(3)}</select></label></div><p id="rr" aria-live="polite" style="margin-top:10px"><b>${RATE(3,3)}</b></p><p class="pct">Scale 1 to 5. A consequence of 5 (serious safety or environmental harm) rates at least High.</p></div><h2>Finding template</h2><div class="card"><p>Condition, criteria, cause, consequence, evidence, risk rating, recommendation, owner, due date, validation method.</p></div><h2>Evidence request starters</h2><div class="card"><p>Network diagrams and rule exports; asset inventory; remote access logs and approvals; account lists and leaver records; backup and restore test records; patch and exception register; incident response plan and exercise records; supplier contracts and access lists.</p></div>`,
architecture:()=>`<h1>Architecture center</h1><h2>Purdue model</h2>${purdue()}<h2>Zones and conduits</h2>${chain(["Zone: Enterprise IT","Conduit: firewall allowlist","Zone: Site operations","Conduit: protocol rules","Zone: Control","Conduit: restricted","Zone: Safety"],[1,3,5],"Zones and conduits")}<h2>Industrial DMZ</h2>${chain(["Enterprise network","Firewall","Industrial DMZ","Firewall","Operations and control"],[2],"Industrial DMZ")}<h2>Remote access</h2>${chain(["Remote user or vendor","MFA gateway","Jump server","Brokered session","Target system"],[2],"Remote access")}<h2>Multi-site</h2>${chain(["Enterprise IT and cloud","Central security services","Regional connectivity","Site industrial DMZ","Site operations","Control and safety zones"],[1,3],"Multi-site")}<p>Explanations are in modules 1.5, 2.1, 2.2, 2.3 and 4.3.</p>`,
career:()=>`<h1>Career roadmap</h1>${tbl(["Stage","Typical focus","Evidence to build"],[["Level 1 to 2: practitioner","Asset visibility, segmentation, access, basic assessments","Inventory, firewall reviews, recovery tests"],["Level 3: advanced practitioner","Architecture review, detection, technical assessment","Assessment reports, detection rules"],["Level 4: expert or auditor","Zone design, 62443 risk work, leading assessments","Design packages, lead-assessor experience"],["Level 5: architect or program leader","Strategy, governance, risk and executive communication","Program roadmap, board briefings"]])}<p>Certifications to evaluate, checking current requirements with each body: GIAC GICSP, the ISA/IEC 62443 certificate programs, and CISSP or CISM for governance roles. Pair them with hands-on lab work and site experience.</p>`};
document.addEventListener("input",e=>{if(e.target.id==="gf")$("#gl").innerHTML=glList(e.target.value)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.c!==undefined){S.chk[t.dataset.c]=t.checked;save();$("#cp").textContent=Object.keys(S.chk).filter(k=>S.chk[k]).length+" of "+CK.length+" reviewed"}if(t.id==="rl"||t.id==="rc")$("#rr").innerHTML="<b>"+RATE(+$("#rl").value,+$("#rc").value)+"</b>"});
document.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){caseF=b.dataset.f;$("#main").innerHTML=REFV.cases()}});

const DX={A:"Draw a control loop and a SIS function and mark the effect of each failure.",B:"Redraw a real network on Purdue levels and list every bypass path.",C:"Write a normal baseline and two alert rules for one protocol.",D:"Map one incident to a six-step path with a detection per step.",E:"Write two findings with condition, criteria, evidence and consequence.",F:"Map five controls to 62443 foundational requirements.",G:"Run a restore test and document the result.",H:"Draft a one-page containment decision guide with decision rights.",I:"Estimate one scenario as ranges and write a three-line executive brief.",J:"Assess one emerging technology for maturity, risk and prerequisites."};

ization before concluding, and escalate fast if it is unapproved."],["C","Which is a deployment choice rather than a protocol design limitation?",["Modbus lacks authentication","IEC 104 lacks native security","Modbus port 502 reachable from the internet","DNP3 authentication is optional"],2,"Exposure is a configuration and architecture decision you can fix."],["C","An OPC UA endpoint accepts security mode None. Best recommendation?",["Leave it, it works","Disable logging","Switch to Modbus","Enforce SignAndEncrypt and manage certificate trust lists"],3,"Enable the protocol's own protections and manage trust properly."],["D","Stuxnet hid its effect from operators by:",["Encrypting the HMI","Blocking USB ports","Replaying normal process values while altering logic","Deleting the historian"],2,"Operators saw normal values while the process was manipulated, per public analyses."],["D","A common path into OT environments is:",["IT compromise and weakly controlled remote access","Radio interference","Sensor aging","Cable cutting"],0,"Many incidents begin in IT and move through remote access or weak segmentation."],["D","Attribution in public incident reports should be treated as:",["Proven fact","Analytical judgment with stated confidence","Irrelevant","Marketing"],1,"It is analysis, usually with confidence levels."],["E","A policy requires approved firewall changes, but logs show many unapproved changes. Which fails?",["Existence","Design only","Operating effectiveness","None"],2,"The control exists and is designed but does not operate as intended."],["E","Best evidence that leavers lose access:",["The policy document","Comparing the HR leaver list with account records and dates","One interview","Training slides"],1,"Independent records show the control operating."],["E","Safest first assessment method on live OT:",["Document, configuration and passive traffic review","Exploit testing","Fuzzing","Flooding"],0,"It has no process impact."],["F","Which 62443 part addresses d for cost savings","Treated as a limit needing strong justification and senior approval","Ignored","Equal to downtime"],1,"Serious harm is not offset by savings."],["I","A useful key risk indicator is:",["Critical zones with no monitoring","Number of dashboards","Meeting count","Report length"],0,"It shows risk exposure, not activity."],["I","Best way to brief executives:",["Packet details","Tool list","Risk in business and safety terms, options and the decision needed","Acronym glossary"],2,"Leaders need risk, options and a clear ask."],["J","Zero Trust for legacy PLCs mainly relies on:",["Device authentication on the PLC","Surrounding network enforcement and strong identity at boundaries","Nothing","Cloud tools only"],1,"Legacy controllers cannot authenticate, so the network enforces policy."],["J","Preferred cloud data flow from OT:",["Inbound connections to PLCs","A shared password","Outbound-only replication via a DMZ or edge gateway","An open port"],2,"Outbound-only flow limits inbound attack paths."],["J","First step toward post-quantum readiness in OT:",["Inventory cryptography in devices, protocols and certificates","Replace everything","Ignore it","Buy a product"],0,"You cannot plan a migration without knowing what exists."],["F","Saudi OTCC-1:2022 is best described as:",["A vendor product certification","A protocol for substations","An NCA control set for OT and ICS environments that extends ECC-1:2018","A NIST publication"],2,"It is issued by the National Cybersecurity Authority; applicability is set by the NCA."],["A","A transmitter is spoofed to report a normal tank level while the tank fills. Which property is mainly attacked?",["Confidentiality","Integrity of process data","Licensing","Latency only"],1,"Operators and controllers act on false data."],["B","Which finding is most serious in a Purdue review?",["A historian replica in the DMZ","An unmanaged cellular router linking Level 1 to the internet","A jump server with MFA","Allow rules with named ction?",["Govern","Quantify","Patch","Encrypt"],0,"Govern joined the original five functions."],["D","A durable lesson from the 2015 Ukraine grid attack:",["Air gaps are always sufficient","Only malware signatures matter","Sensors were the entry point","Credential and remote access control plus manual recovery procedures matter"],3,"These controls limit and recover from this attack pattern."],["A","Which signal range is standard for analog field transmitters?",["0 to 5 V only","4 to 20 mA","1 to 100 Hz","RS-232"],1,"4 to 20 mA is the classic analog loop signal."],["A","In a PLC scan cycle, outputs are written:",["Before inputs are read","After the logic executes","Never","Only on reboot"],1,"The scan reads inputs, runs logic, then writes outputs."],["A","A building management system mainly controls:",["Building HVAC, access and energy systems","Refinery reactors","Substation relays","Safety shutdown valves"],0,"BMS covers facility systems."],["A","Scenario: an engineer wants to bypass a SIS trip during startup. Best practice?",["Bypass it quietly","Disable the alarm instead","Use an authorized, documented bypass under management of change with compensating measures","Ask IT to approve"],2,"Bypasses are controlled safety decisions with compensating measures."],["B","Which device gives one-way data flow from OT to IT by design?",["A stateful firewall","A unidirectional gateway (data diode)","A router","A switch"],1,"It enforces a single direction."],["B","Microsegmentation primarily:",["Replaces all firewalls","Encrypts controller memory","Removes the need for zones","Restricts communication at cell or asset level"],3,"It applies zone logic at a finer grain."],["B","Scenario: a DMZ historian initiates connections into Level 2 servers. Better pattern?",["Keep it","Have the inner system push data to the DMZ so the DMZ does not initiate into OT","Open all ports","Move the historian to Level 0"],1,"Connections should be initiated from the more trusted side."],["B","Redundancy rings such as RSTP are chosen mainly for:",["Resilience after link failure","Encryption","Logging","Patching"],0,"They keep traffic flowing after a link fails."],["C","Which protocol commonly uses UDP 47808?",["BACnet","Modbus","DNP3","OPC UA"],0,"UDP 47808 is the BACnet port."],["C","SNMP v3 improves on v2c mainly by adding:",["Faster polling","Authentication and optional encryption","Broadcast","Legacy support"],1,"v2c uses cleartext community strings."],["C","Scenario: OPC Classic tags must cross a firewall. Best approach?",["Open all high TCP ports","Disable the firewall","Use a gateway or tunneling product designed for OPC in the DMZ","Use Telnet"],2,"DCOM dynamic ports make direct rules unsafe."],["C","A laptop sends repeated Modbus diagnostic function requests to a PLC. Reasonable view?",["Always benign","Unusual, so verify authorization","Encryption","DNS activity"],1,"Unexpected diagnostics from a new source warrant review."],["D","An example of living off the land is:",["A custom zero-day","Using built-in remote administration tools","A hardware implant","Satellite jamming"],1,"It uses legitimate tools already available."],["D","Why are engineering workstations high-value targets?",["Fast CPUs","They hold email","They hold only backups","They can change controller logic"],3,"Logic downloads originate there."],["D","Ransomware can halt production without touching a PLC when:",["PLC firmware is old","Sensors are analog","Operations depend on affected IT services","The network is wired"],2,"Dependencies on IT services can stop safe operation."],["D","Best use of ATT&CK for ICS in an assessment:",["Scoring vendor products","Replacing risk assessment","Counting alerts","Structuring detection coverage and attack-path discussion"],3,"It is a shared vocabulary, not a score."],["E","Which approach strengthens an audit conclusion?",["A single example","A representative sample with stated limits","Opinion","No sampling"],1,"Sampling and stated limits make conclu REFV.otcc=()=>`<h1>NCA OTCC (Saudi Arabia)</h1><p>The Operational Technology Cybersecurity Controls (OTCC-1:2022) were issued by Saudi Arabia's National Cybersecurity Authority in April 2022 as an extension of its Essential Cybersecurity Controls (ECC-1:2018) for OT and ICS environments. Use the official documents for control wording. This page is a study aid and does not reproduce the controls.</p><div class="card"><b>Applicability.</b> Whether and how OTCC applies to an organization is set by the NCA and the sector regulator. Confirm before relying on it.</div><h2>Structure</h2><p>Four domains: Governance, Defense, Resilience and Third-Party cybersecurity. Secondary sources report 23 subdomains, 47 main controls and 122 subcontrols, with requirements scaled across three levels by facility criticality. Confirm these figures in the official PDF.</p><h2>Study mapping to this platform</h2><p class="pct">This is our own mapping at domain level, not an NCA mapping. The NCA publishes a Methodology and Mapping Annex.</p>${tbl(["OTCC domain","Related modules","Typical evidence to prepare"],[["Governance","<a href=\"#m-5-1\">5.1</a>, <a href=\"#m-5-2\">5.2</a>, <a href=\"#m-5-3\">5.3</a>, <a href=\"#m-5-4\">5.4</a>, <a href=\"#m-2-5\">2.5</a>","Charter, policies, roles, risk register, asset inventory with owners"],["Defense","<a href=\"#m-1-5\">1.5</a>, <a href=\"#m-2-1\">2.1</a> to <a href=\"#m-2-3\">2.3</a>, <a href=\"#m-2-6\">2.6</a>, <a href=\"#m-2-7\">2.7</a>, <a href=\"#m-3-1\">3.1</a>, <a href=\"#m-3-6\">3.6</a> to <a href=\"#m-3-9\">3.9</a>, <a href=\"#m-4-3\">4.3</a>","Network diagrams, rule exports, access and remote session records, hardening baselines, monitoring logs"],["Resilience","<a href=\"#m-2-6\">2.6</a>, <a href=\"#m-5-7\">5.7</a>","Impact analysis, recovery objectives, restore test records, exercise reports"],["Third-Party","<a href=\"#m-2-3\">2.3</a>, <a href=\"#m-4-9\">4.9</a>","Contract clauses, supplier access lists, assessment records, access removal at contract end"]])}<p>Check in the official document where incident handling and change management sit, then align <a href=\"#m-3-10\">3.10</a> and the toolkit evidence list.</p><h2>Preparing for an assessment</h2><ul><li>Download the controls, the methodology and mapping annex, and the NCA assessment and compliance tool.</li><li>Define scope and facility criticality first, because it drives the applicable level.</li><li>Map one evidence set to OTCC, 62443 and your internal controls to collect it once.</li><li>Distinguish control existence, design, implementation and operating effectiveness, as in <a href="#m-2-8">2.8</a>.</li></ul><p><a href="https://nca.gov.sa/en/pages/otcc.html" target="_blank" rel="noopener">Official NCA OTCC page</a></p>`;

 document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const k=+o.dataset.k,j=+o.dataset.j,q=b.quiz[k],box=o.parentElement;
  box.querySelectorAll(".opt").forEach((x,t)=>{x.disabled=true;if(t===q[2])x.classList.add("ok")});if(j!==q[2])o.classList.add("bad");
  box.querySelector(".fb").textContent=(j===q[2]?"Correct. ":"Not quite. ")+q[3];
  (S.quiz[id]=S.quiz[id]||{})[k]=j===q[2]?1:0;save();const r=S.quiz[id];$("#sc").textContent="Score so far: "+Object.values(r).reduce((a,c)=>a+c,0)+" of "+Object.keys(r).length+" answered"})}
function list(ms,empty){return ms.length?`<div class="ladder">${ms.map(m=>`<a class="rung" style="grid-template-columns:1fr" href="#m-${m.id}"><span>${m.num} ${m.title} <span class="tag">Level ${m.lv+1}</span></span></a>`).join("")}</div>`:`<div class="empty">${empty}</div>`}
let term="";
function search0(){
 const t=term.trim().toLowerCase();if(!t)return `<h1>Search</h1><div class="empty">Type a topic such as “remote access” or “Purdue” in the search box.</div>`;
 const hit=MODS.filter(m=>(m.title+" "+(BODY[m.id]?JSON.stringify(BODY[m.id]).replace(/<[^>]+>/g," "):"")+" "+LV[m.lv][0]).toLowerCase().includes(t));
 return `<h1>Search results</h1><p class="pct">${hit.length} result${hit.length===1?"":"s"} for “${esc(term)}”</p>`+list(hit,"No lessons match. Try a shorter or broader term.")}
function render(){
 const id=(location.hash||"#home").slice(1);let h;
 if(id==="home")h=home();else if(id==="bookmarks")h=`<h1>Bookmarks</h1>`+list(MODS.filter(m=>S.bm[m.id]),"No bookmarks yet. Open a lesson and choose Bookmark to save it here.");
 else if(REFV[id])h=REFV[id]();else if(id==="search")h=search();else if(id.startsWith("m-"))h=mod(id.slice(2));else h=home();
 $("#main").innerHTML=h;nav(id==="search"?"":id);wire(id.slice(2));
 $("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false")}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
$("#home").onclick=()=>{location.hash="home"};
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#q").oninput=e=>{term=e.target.value;if(location.hash!=="#search")location.hash="search";else render()};
$("#theme").onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");d.dataset.theme=S.theme=c==="dark"?"light":"dark";save()};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus()}});
if(S.theme)document.documentElement.dataset.theme=S.theme;
render();
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(e){}}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{navigator.serviceWorker.register("service-worker.js",{scope:"./"}).catch(()=>{})})}
</script>
