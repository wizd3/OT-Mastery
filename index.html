<main id="main" tabindex="-1"><noscript><p>This platform needs JavaScript. Level outlines: Foundations, Practitioner, Advanced Practitioner, Expert, Mastery.</p></noscript></main>

<script>
"use strict";
const LV=[
["Foundations","IT vs OT and the ICS landscape|Process types and instrumentation|PLC, DCS, SCADA, RTU, HMI and BMS|Safety systems, SIS and fail-safe design|Purdue model and ISA-95|Industrial networking basics|Protocol primer: Modbus and OPC Classic|OT security principles|Threat basics and ATT&CK for ICS"],
["Practitioner","Segmentation, zones and conduits|Industrial DMZ|Secure remote access|Protocols I: CIP, PROFINET, DNP3, IEC 104|Asset discovery and baselining|Hardening, patching and backup|Identity and access basics|Assessment lifecycle and audit basics|62443 and NIST 800-82 essentials|Monitoring, IR and risk basics"],
["Advanced Practitioner","Architecture and firewall rule review|Protocols II: IEC 61850, OPC UA, MQTT and more|Packet analysis labs|Attack tradecraft and ATT&CK mapping|Incident analysis I|IAM, PAM, AD and MFA in OT|Endpoint hardening and virtualization|Technical assessments and control testing|Detection engineering and SIEM|OT incident response"],
["Expert","62443-3-2 risk assessment and target SLs|62443-3-3, 4-1 and 4-2 requirements|Security architecture design|Incident analysis II|Leading assessments and reporting|OT SOC design|Cloud, IIoT, edge and wireless|Safety and security integration|Third-party and supply-chain assurance"],
["Mastery","Program strategy and governance|Risk quantification and financial translation|Maturity models, KPIs and KRIs|Regulatory landscape|Zero Trust, SDN and secure-by-design|AI, digital twins and PQC|Crisis management and BCDR|Executive communication and capstone"]];
const PH=[3,4,5,6,7];
const MODS=[];LV.forEach((l,i)=>l[1].split("|").forEach((t,j)=>MODS.push({id:`${i+1}-${j+1}`,num:`${i+1}.${j+1}`,lv:i,title:t})));
const BODY={"1-1":{why:"Most OT incidents become costly because responders apply IT instincts to systems whose first job is keeping a physical process safe and running. Knowing where the two worlds differ is the base for every later decision.",
obj:["Contrast IT and OT priorities, lifecycles and failure consequences","Name the main ICS component types and their roles","Explain why a security change can be a safety change"],
core:"<p>IT systems protect data, so confidentiality usually leads. OT systems control physical processes, so safety and availability lead, and integrity of commands and measurements follows closely. Confidentiality is often the lowest concern.</p><div class='scroll'><table><tr><th>Aspect</th><th>Typical IT</th><th>Typical OT</th></tr><tr><td>Top priority</td><td>Confidentiality</td><td>Safety and availability</td></tr><tr><td>Lifecycle</td><td>3 to 5 years</td><td>15 to 30 years</td></tr><tr><td>Patching</td><td>Frequent, automated</td><td>Planned outages, vendor-approved</td></tr><tr><td>Latency</td><td>Tolerant</td><td>Deterministic, often milliseconds</td></tr><tr><td>Failure impact</td><td>Data loss, downtime</td><td>Injury, environmental release, equipment damage</td></tr></table></div>",
exp:"Experts treat the table as a starting point, not a rule. Modern OT has Windows servers and IT-style networks, so the real skill is deciding per asset which IT control is safe to apply, and how to prove it.",
quiz:[["Which priority normally leads in OT?",["Confidentiality of data","Safety and availability","Lowest cost","Fast patching"],1,"Physical consequences make safety and availability first; integrity follows."],["Why can a routine IT patch be risky on a PLC network?",["It always fails","It may change timing or behavior of a live process","PLCs cannot be patched","Patches cost more"],1,"Unvalidated changes can alter deterministic behavior; test and schedule them."],["A typical OT asset lifecycle is closer to:",["1 to 2 years","3 to 5 years","15 to 30 years","Under a year"],2,"Long lifecycles mean legacy systems stay in service and need compensating controls."]],
ex:"List five assets in a plant you know. For each, write the consequence of a one-hour loss of availability and of a wrong command being accepted. Rank them by safety impact."}};
const PUR=[["Level 5","Enterprise network"],["Level 4","Site business planning (ERP, email)"],["Level 3.5","Industrial DMZ (broker between IT and OT)"],["Level 3","Site operations (historian, patching, jump servers)"],["Level 2","Area supervisory (HMI, SCADA servers)"],["Level 1","Basic control (PLC, RTU, DCS controllers)"],["Level 0","Process (sensors, actuators, drives)"]];
const purdue=()=>`<svg viewBox="0 0 640 ${PUR.length*44+8}" role="img" aria-label="Purdue model, Level 0 at the bottom to Level 5 at the top" style="width:100%;max-width:640px">`+PUR.map((r,i)=>{const d=i===2;return `<g><rect x="4" y="${4+i*44}" width="632" height="38" rx="6" style="fill:var(--${d?"panel2":"panel"});stroke:var(--${d?"ac":"line"})"/><text x="16" y="${28+i*44}" style="fill:var(--ac);font:700 14px sans-serif">${r[0]}</text><text x="110" y="${28+i*44}" style="fill:var(--tx);font:14px sans-serif">${r[1]}</text></g>`}).join("")+`</svg>`;
Object.assign(BODY,{
"1-2":{why:"Every control decision rests on measuring and moving physical quantities. An attacker who alters a measurement or a command changes the process itself.",
obj:["Distinguish continuous, batch and discrete processes","Trace a control loop from sensor to actuator","Identify where tampering with a signal causes physical effect"],
core:`<p><b>Process types.</b> Continuous processes (refining, power generation, water treatment) run without stopping and tolerate little disruption. Batch processes (pharmaceuticals, specialty chemicals) follow recipes in discrete lots. Discrete manufacturing (automotive, packaging) builds countable items on lines where cycle time matters.</p><p><b>The control loop.</b> A sensor measures a variable such as flow. A transmitter converts it to a standard signal, commonly 4 to 20 mA, sometimes with digital data added by HART or a fieldbus. The controller compares the value with a setpoint using PID logic and drives an actuator, such as a control valve or a variable speed drive, to close the gap.</p><h2>Security implications</h2><p>Falsified measurements (integrity) can make a controller act wrongly while operators see normal values. Changed setpoints, limits or tuning can push a process out of its safe range. Field devices rarely authenticate commands, so protection depends on the network and controller layers above them.</p><h2>Common mistakes</h2><p>Treating transmitters and drives as harmless peripherals, and forgetting that smart field devices carry firmware and configuration.</p>`,
exp:"Ask of any asset: what physical quantity does it measure or move, and what is the worst credible consequence of a wrong value? That question drives criticality later.",
quiz:[["A 4 to 20 mA signal is typically:",["A network protocol","An analog transmitter signal","A logging format","A safety rating"],1,"It is the classic analog field signal carrying a measured value."],["Which process type is least tolerant of stopping?",["Batch","Discrete","Continuous","All equal"],2,"Continuous plants may take days to restart safely."],["Spoofing a sensor value mainly attacks:",["Confidentiality","Integrity of the process view","Licensing","Backups"],1,"The controller and operator act on false data."]],
ex:"Draw the loop for a tank level control: name the sensor, signal, controller, actuator and setpoint. Mark two points where a wrong value could overfill the tank."},
"1-3":{why:"Control system components differ in what they do and in how much damage compromising them can cause. Defenders must know them by role.",
obj:["Describe PLC, DCS, SCADA, RTU, HMI and BMS roles","Explain the PLC scan cycle","Identify why engineering workstations are critical assets"],
core:`<div class="scroll"><table><tr><th>Component</th><th>Role</th><th>Typical sector</th></tr><tr><td>PLC</td><td>Executes control logic on a fast scan cycle</td><td>Manufacturing, utilities</td></tr><tr><td>DCS</td><td>Integrated, redundant control of a continuous plant</td><td>Refining, chemicals, power</td></tr><tr><td>SCADA</td><td>Supervises geographically spread sites</td><td>Pipelines, water, grid</td></tr><tr><td>RTU</td><td>Remote data collection and control, often over WAN</td><td>Pipelines, substations</td></tr><tr><td>HMI</td><td>Operator view and commands</td><td>All</td></tr><tr><td>BMS</td><td>Building HVAC, access, energy</td><td>Facilities</td></tr></table></div><p>A PLC repeats a scan: read inputs, run the logic, write outputs, handle communications. Scan time is milliseconds, so timing is part of correct behavior. Most PLCs have run modes (run, program, remote) that determine whether logic can be changed.</p><h2>Security implications</h2><p>The engineering workstation holds project files and can download logic to controllers, so compromising it can reconfigure the process. Historians and HMIs are common pivot points between levels.</p><h2>Common mistakes</h2><p>Assuming controller logic cannot be changed remotely, or leaving controllers in program mode permanently.</p>`,
exp:"Rank assets by what they can change, not by how they look. The engineering workstation often outranks a controller it programs.",
quiz:[["Which system best fits a long pipeline with remote sites?",["DCS","SCADA with RTUs","BMS","HMI only"],1,"SCADA is built for dispersed assets with telemetry."],["Why is the engineering workstation critical?",["It is the fastest","It can modify controller logic","It stores email","It runs the historian"],1,"Logic downloads originate there."],["What does a PLC key switch position commonly control?",["Screen brightness","Whether logic can be changed","Network speed","Time zone"],1,"Run, program and remote modes limit changes."]],
ex:"For a plant you know, list each component type present and mark which can change controller logic. Identify who has access to each."},
"1-4":{why:"Safety systems are the last engineered barrier between a process upset and harm. Security work near them demands extra discipline.",
obj:["Explain the purpose of an SIS and ESD","Describe fail-safe design and independent protection layers","State why SIS changes need functional safety governance"],
core:`<p>A safety instrumented system (SIS) detects dangerous conditions and drives the process to a safe state, independently of the basic process control system (BPCS). Each safety instrumented function (SIF) has a target integrity level (SIL) from the functional safety standards (IEC 61508 and IEC 61511). Emergency shutdown (ESD) and fire and gas systems follow the same logic.</p><p>Fail-safe design means a loss of power, signal or communication moves the process to a safe state, such as a valve that closes when de-energized.</p><p><b>Example.</b> A reactor high-pressure trip: independent transmitters vote, the logic solver opens a vent valve, and no operator action is required.</p><h2>Security implications</h2><p>If an attacker disables or alters the SIS, the last barrier is gone while the process may still look normal. Public reporting on the TRITON incident showed that safety controllers can be targeted directly; we study it at Level 4.</p><h2>Common mistakes</h2><p>Joining the SIS to general plant networks for convenience, and patching or reconfiguring it like a BPCS component without management of change.</p>`,
exp:"Security controls near the SIS must be reviewed with functional safety engineers. A control that adds latency or fails closed can itself degrade the safety function.",
quiz:[["The SIS should be:",["The same as the BPCS","Independent of the BPCS","Managed by IT patching","Optional"],1,"Independence prevents one failure disabling both layers."],["Fail-safe means:",["Never fails","Failure leads to a safe state","Fails open always","Has no power"],1,"The default state on loss is the safe one."],["Who must approve SIS configuration changes?",["Any administrator","The functional safety and engineering process owners","The vendor only","No one"],1,"Changes follow management of change under functional safety rules."]],
ex:"Pick a hazard (overpressure, overflow). Name the BPCS control and the independent SIS action. Write one security control that protects the SIS and one risk that control could introduce."},
"1-5":{why:"The Purdue model is the shared language for where systems sit and what should talk to what. Nearly every architecture review starts from it.",
obj:["Label Purdue levels 0 to 5 and the industrial DMZ","Explain the relationship between Purdue and ISA-95","Recognize where real networks depart from the model"],
core:`${purdue()}<p>The Purdue Enterprise Reference Architecture organizes functions into levels. ISA-95 defines the functional hierarchy and information exchange between enterprise and control systems; in practice the two are used together. Level 3.5, the industrial DMZ, is a later practical addition that brokers traffic between IT and OT.</p><p><b>Reading the model.</b> Traffic should flow in controlled, minimal paths between adjacent levels. Direct paths from Level 4 to Level 1 are red flags.</p><h2>Security implications</h2><p>Each level is a trust boundary candidate. Remote access, cloud connectors and vendor laptops often bypass the model, creating paths the diagram never shows.</p><h2>Common mistakes</h2><p>Treating a level as a security guarantee, or forcing legacy plants to match the diagram when the real traffic flows differ. Draw the real flows first.</p>`,
exp:"Purdue is a thinking tool, not a compliance target. IIoT, edge and cloud services blur levels, so experts map data flows and trust boundaries, then use the levels to explain them.",
quiz:[["Where does the industrial DMZ sit?",["Level 0","Between Level 3 and Level 4","Level 1","Inside the PLC"],1,"It separates site operations from business networks."],["Level 1 contains:",["ERP","Controllers such as PLCs","Email servers","Cloud tools"],1,"Basic control devices live at Level 1."],["A direct firewall rule from Level 4 to a Level 1 PLC is:",["Best practice","A finding to review","Required","Irrelevant"],1,"It skips supervisory and DMZ layers and needs justification."]],
ex:"Sketch your site's real network on the Purdue levels. Mark every connection that skips a level and note who owns it."},
"1-6":{why:"Control traffic is time-sensitive, and the network equipment carrying it behaves differently from office networks. Misunderstanding this causes outages during security work.",
obj:["Describe VLANs, routing, firewalls and industrial switches","Explain redundancy rings and why they matter","Identify networking choices that raise risk"],
core:`<p>Industrial networks are mostly Ethernet with managed switches. VLANs separate traffic logically, routers or layer 3 switches move traffic between them, and firewalls enforce policy. Industrial switches are hardened for heat and vibration and often form redundant rings using protocols such as RSTP or vendor ring technologies. Substations commonly use PRP and HSR for zero-loss redundancy.</p><p>Many control protocols rely on broadcast or multicast, and some are sensitive to delay and jitter.</p><h2>Security implications</h2><p>Flat networks let a single compromised host reach every controller. Default credentials, unmanaged switches and unused open ports are common findings. Aggressive scanning or a broadcast storm can disrupt fragile devices.</p><h2>Common mistakes</h2><p>Applying IT segmentation changes without checking multicast needs, ring behavior or failover timing.</p>`,
exp:"Learn the traffic before changing the network. Passive capture on a mirror port gives you the flows without touching devices.",
quiz:[["A VLAN provides:",["Encryption","Logical traffic separation","Antivirus","Time sync"],1,"VLANs separate broadcast domains but do not filter by themselves."],["Why can aggressive scanning be unsafe in OT?",["It is slow","Fragile devices may fault or stop","It is illegal","It uses power"],1,"Some controllers mishandle unexpected traffic."],["Rings are used for:",["Billing","Network redundancy","Encryption","Logging"],1,"They keep traffic flowing after a link failure."]],
ex:"Given a switch port list with VLAN assignments, identify unused ports, flat segments and one segment where a firewall belongs. Justify each."},
"1-7":{why:"Protocols define what an attacker can read or command. Modbus and OPC Classic show the oldest and most common design patterns.",
obj:["Explain the Modbus client-server model and function codes","Describe why OPC Classic is firewall-unfriendly","Separate protocol design limitations from deployment mistakes"],
core:`<p><b>Modbus TCP</b> uses a client (master) that sends requests to servers (slaves) on TCP port 502. A frame has a header with transaction ID, protocol ID, length and unit ID, followed by a function code and data. Function codes read or write coils and registers. The protocol has no authentication and no encryption.</p><p><b>OPC Classic</b> exchanges tags between applications over Windows COM and DCOM, which use dynamic ports and complex permissions. It is hard to firewall safely and is being replaced by OPC UA, which we cover at Level 3.</p><h2>Security implications</h2><p>Anyone who can reach port 502 can read values and issue write commands. That is a design limitation. Exposing port 502 to the internet or a flat network is a deployment choice, and the one defenders can fix.</p><h2>Common mistakes</h2><p>Opening wide DCOM port ranges for OPC, or assuming obscurity protects Modbus devices.</p>`,
exp:"Compensate for weak protocols with architecture: segmentation, function code allowlisting, and monitoring of write commands from unexpected sources.",
quiz:[["Modbus TCP default port is:",["22","502","443","102"],1,"TCP 502 is the registered Modbus port."],["Lack of authentication in Modbus is a:",["Misconfiguration","Design limitation","Licensing issue","Bug fix"],1,"The protocol never included it."],["Why is OPC Classic hard to firewall?",["Uses UDP only","Relies on DCOM with dynamic ports","Is encrypted","Is modern"],1,"Dynamic ports force wide rules or tunneling gateways."]],
ex:"Review a sample capture description: a laptop sends write-register requests to a PLC from an unknown address. List three questions you would ask and two controls that would have prevented it."},
"1-8":{why:"Principles prevent well-meant security actions from causing outages or safety events. They are the filter for every later recommendation.",
obj:["State OT security priorities and their order","Apply defense in depth and least privilege to OT","Explain why passive methods come first"],
core:`<p><b>Priorities.</b> Safety first, then availability and integrity of the process, then confidentiality. Determinism matters: a control that adds latency or may restart a device can be a safety issue.</p><p><b>Core principles.</b> Defense in depth (layered controls, none assumed perfect), segmentation, least privilege, secure remote access, change management, tested backups, and monitoring that does not disturb the process.</p><h2>Practical rule</h2><p>Prefer passive observation before active probing. Test changes in a lab or during planned outages. Involve operations and engineering before any change. Get vendor support confirmation for software on control systems.</p><h2>Common mistakes</h2><p>Importing IT tools unchanged, such as vulnerability scanners and endpoint agents, and treating a failed security control as acceptable because it failed closed.</p>`,
exp:"The best OT security engineers say yes to controls that are safe and no, with an alternative, to those that are not. Credibility with operations is the core skill.",
quiz:[["The first OT priority is:",["Confidentiality","Safety","Speed","Cost"],1,"Preventing harm comes before all else."],["Before active scanning you should:",["Scan all","Use passive monitoring and get approval","Disable alarms","Reboot devices"],1,"Passive first, active only with coordination."],["Defense in depth means:",["One strong firewall","Multiple layered controls","No patching","Single vendor"],1,"Layers limit the impact when one control fails."]],
ex:"Take a proposed control (EDR agent on an HMI). Write the safety, availability and vendor-support questions you must answer before approval."},
"1-9":{why:"Understanding who attacks OT and how, in a shared vocabulary, lets you reason about risk and communicate it. This module also closes Level 1.",
obj:["Identify main threat actor types and entry paths","Name the tactics in MITRE ATT&CK for ICS","Demonstrate Level 1 mastery in the gate quiz"],
core:`<p><b>Actors.</b> Nation-state groups (disruption, pre-positioning), criminal groups (ransomware, extortion), hacktivists, insiders and accidental error, and compromised suppliers.</p><p><b>Entry paths.</b> IT-to-OT movement through weak segmentation, remote access and vendor connections, removable media, supply chain compromise, and internet-exposed devices.</p><p><b>ATT&CK for ICS.</b> MITRE's knowledge base describes adversary behavior against industrial systems in tactics: Initial Access, Execution, Persistence, Privilege Escalation, Evasion, Discovery, Lateral Movement, Collection, Command and Control, Inhibit Response Function, Impair Process Control and Impact. ATT&CK is versioned twice a year (v20 was current in October 2026), so check attack.mitre.org for the current tactic list.</p><h2>Security implications</h2><p>Many OT impacts begin on the IT side. Ransomware can halt production without touching a PLC when operations depend on IT services.</p><h2>Common mistakes</h2><p>Assuming air gaps exist without verifying, and focusing only on exotic malware instead of remote access and credentials.</p>`,
exp:"Use ATT&CK as a shared language for detection coverage and assessment findings, not as a checklist of everything to defend equally.",
quiz:[["Which tactic involves stopping safety or alarm responses?",["Discovery","Inhibit Response Function","Collection","Evasion"],1,"It covers actions that prevent protective responses from working."],["The most common IT-to-OT path is:",["Radio","Remote access and weak segmentation","Printers","Power lines"],1,"Poorly controlled access is repeatedly reported."],["Level 3.5 is:",["Cloud","Industrial DMZ","Field devices","ERP"],0+1,"It is the broker between IT and OT."],["Which is a design limitation, not a misconfiguration?",["Exposed port 502","Modbus lacking authentication","Default password","Open USB"],1,"Protocol design never included it."],["Why is a safety system change different from a routine patch?",["It is cheaper","It needs functional safety management of change","It is automated","No difference"],1,"The SIS is the last protective layer."]],
ex:"Level 1 completion criteria: finish all nine modules, score at least 80 percent on the knowledge checks, label the Purdue diagram from memory, and complete one exercise of your choice in writing. Then mark each module complete."}
});
const chain=(a,h,l)=>`<svg viewBox="0 0 640 ${a.length*54+4}" role="img" aria-label="${l}" style="width:100%;max-width:640px">`+a.map((t,i)=>{const y=4+i*54,x=h.includes(i);return `<rect x="60" y="${y}" width="520" height="38" rx="6" style="fill:var(--${x?"panel2":"panel"});stroke:var(--${x?"ac":"line"})"/><text x="320" y="${y+24}" text-anchor="middle" style="fill:var(--tx);font:14px sans-serif">${t}</text>`+(i<a.length-1?`<path d="M320 ${y+38}v16m-5-6l5 6 5-6" style="fill:none;stroke:var(--ac2);stroke-width:2"/>`:"")}).join("")+`</svg><p class="pct">Arrows show the permitted path; traffic is allowed only where a rule says so.</p>`;
Object.assign(BODY,{
"2-1":{why:"Segmentation limits how far an intruder or a fault can spread, and zones and conduits give a rigorous way to define it.",
obj:["Define zones and conduits as used in IEC 62443","Group assets into zones by function and risk","Specify allowed flows across a conduit"],
core:`<p>A <b>zone</b> is a group of assets that share security requirements. A <b>conduit</b> is the controlled communication path between zones. Zones are drawn by consequence and function, not by IP subnet alone: for example a safety zone, a batch control zone, a historian zone and a vendor access zone.</p>${chain(["Zone: Enterprise IT","Conduit: firewall with allowlist","Zone: Site operations","Conduit: firewall with protocol rules","Zone: Area control (HMI, PLC)","Conduit: dedicated, restricted","Zone: Safety (SIS)"],[1,3,5],"Zones separated by conduits")}<p>Each conduit documents its endpoints, protocols and ports, direction, and the controls applied. Microsegmentation applies the same idea at cell or asset level.</p><h2>Security implications</h2><p>One flat zone means one compromise reaches everything. Overlarge zones hide assets with very different consequence levels.</p><h2>Common mistakes</h2><p>Segmenting by VLAN without firewall enforcement, any-any rules between zones, and forgetting that engineering laptops and vendors form unofficial conduits.</p>`,
exp:"Zone design is a risk decision. Put the highest-consequence assets in the smallest, most restricted zones and justify every conduit.",
quiz:[["A conduit is:",["A group of assets","A controlled communication path between zones","A firewall brand","A cable type"],1,"Conduits carry and control traffic between zones."],["Zones should be defined mainly by:",["IP range","Function and risk","Vendor","Color"],1,"Shared security requirements drive grouping."],["VLANs alone give segmentation when:",["Always","Inter-VLAN traffic is also enforced","Never","Using wifi"],1,"Without policy enforcement they only separate broadcast domains."]],
ex:"Group ten sample assets into zones, justify each grouping, and write a conduit table (source, destination, protocol, port, direction) for two of them."},
"2-2":{why:"The industrial DMZ is where most IT/OT data exchange should happen, so its design decides how well the boundary holds.",
obj:["Describe the purpose and contents of the industrial DMZ","Trace a safe data flow from OT to business systems","Avoid direct IT-to-OT connections"],
core:`${chain(["Enterprise network (Levels 4 and 5)","Firewall (IT side)","Industrial DMZ: replicas, brokers, jump hosts","Firewall (OT side)","Site operations and control (Levels 3 and below)"],[2],"Industrial DMZ between IT and OT")}<p>The DMZ hosts services that both sides need without either side connecting straight to the other: historian replicas, patch and antivirus servers, file transfer, and remote access gateways. Rules follow one idea: initiate connections from the more trusted side, or have both sides talk to the DMZ service only.</p><h2>Security implications</h2><p>If the DMZ hosts are weak or share credentials with IT, they become the bridge instead of the barrier. Data diodes or unidirectional gateways can enforce one-way flow where the process needs only outbound data.</p><h2>Common mistakes</h2><p>Allowing the same domain accounts across the DMZ, permitting inbound connections from IT to Level 3 for convenience, and leaving the DMZ unmonitored.</p>`,
exp:"A DMZ is a trust broker, not just a subnet. Reduce what it hosts, harden it like a critical system, and log every flow across it.",
quiz:[["What belongs in the industrial DMZ?",["PLCs","Historian replica and jump host","ERP database","Sensors"],1,"Brokering services live there, not controllers."],["Direct IT to Level 2 rules are:",["Preferred","A bypass of the DMZ to challenge","Required","Harmless"],1,"They skip the controlled exchange point."],["A data diode enforces:",["Two-way flow","One-way flow","Encryption","Backups"],1,"It physically or logically permits a single direction."]],
ex:"Design the DMZ for a plant that needs historian data in the ERP and monthly patches in OT. List each DMZ host, the flows to and from it, and who initiates each."},
"2-3":{why:"Remote access by staff and vendors is one of the most reported OT entry points, and one of the easiest to improve.",
obj:["Describe a secure remote access architecture","Apply MFA, session control and time-bound access","Review third-party access for weaknesses"],
core:`${chain(["Remote user or vendor","Gateway with MFA (IT-side DMZ)","Jump server in the industrial DMZ","Brokered session to the target","Target: HMI, EWS or PLC"],[2],"Remote access path through a jump server")}<p>Principles: no direct inbound connections to OT, MFA at the first hop, individual accounts, access approved per task and time-limited, session recording for privileged work, and a clear way to cut access quickly. Vendors should connect through the same controlled path as staff.</p><h2>Security implications</h2><p>Persistent VPNs, shared vendor accounts and always-on remote tools give attackers a stable route. Stolen credentials without MFA are a common initial access method.</p><h2>Common mistakes</h2><p>Modems and cellular routers installed by vendors, remote desktop exposed to the internet, and no record of who connected to which asset.</p>`,
exp:"Make the secure path the easy path. If approvals are slow, people create shortcuts, so design for urgent cases and review them afterward.",
quiz:[["Where should MFA be enforced?",["Only on PLCs","At the remote access entry point","Nowhere","Only in IT email"],1,"The first hop protects everything behind it."],["Shared vendor accounts are a problem because:",["They are fast","You lose accountability","They need no MFA","They cost more"],1,"Actions cannot be tied to a person."],["A jump server is used to:",["Store backups","Broker and control sessions into OT","Run PLC logic","Replace firewalls"],1,"It centralizes access, logging and policy."]],
ex:"Audit this description: vendor VPN is always on with a shared password and full access to Level 2. List five findings and a fix for each."},
"2-4":{why:"Common industrial protocols differ in security features and in how they should be monitored and filtered.",
obj:["Describe CIP, PROFINET, DNP3 and IEC 104 communication models","Identify built-in and optional security features","State practical filtering and monitoring options"],
core:`<div class="scroll"><table><tr><th>Protocol</th><th>Model and ports</th><th>Security notes</th></tr><tr><td>EtherNet/IP and CIP</td><td>Explicit messaging on TCP 44818, implicit I/O on UDP 2222</td><td>Device identity and controller commands exposed by default; CIP Security (TLS and DTLS based) is optional where supported</td></tr><tr><td>PROFINET</td><td>Layer 2 real-time frames plus discovery (DCP); PROFIBUS is the older serial fieldbus</td><td>Discovery and configuration frames can change device settings on the same segment; limit with segmentation</td></tr><tr><td>DNP3</td><td>Master and outstation, commonly TCP or UDP 20000, unsolicited reports</td><td>Secure Authentication adds challenge response for critical functions; often not enabled</td></tr><tr><td>IEC 60870-5-104</td><td>TCP 2404, ASDU based telecontrol</td><td>No native security; IEC 62351 defines security extensions, rarely deployed</td></tr></table></div><h2>Security implications</h2><p>Control commands such as write, start, stop or select-before-operate can be sent by any reachable client in the default configuration. Monitoring should flag new clients, unusual function codes and write commands outside maintenance windows.</p><h2>Common mistakes</h2><p>Blocking port ranges without understanding multicast or dynamic ports, and assuming optional security features are enabled.</p>`,
exp:"Compare what a protocol allows by design with what the vendor and deployment enable. Verify features in the device configuration, not in the datasheet.",
quiz:[["DNP3 commonly uses port:",["20000","502","443","3389"],0,"TCP or UDP 20000 is the standard assignment."],["IEC 104 native security is:",["Strong TLS","Absent; extensions exist","Mandatory","Quantum"],1,"IEC 62351 provides optional security but is rarely used."],["CIP implicit I/O traffic usually uses:",["TCP 22","UDP 2222","TCP 80","ICMP"],1,"Cyclic I/O data runs over UDP 2222."]],
ex:"For each protocol, write one normal traffic pattern and one anomaly you would alert on."},
"2-5":{why:"You cannot protect what you do not know exists. Accurate inventory and baselines underpin every other control.",
obj:["Build an OT asset inventory with useful fields","Choose passive and safe active discovery methods","Create a network traffic baseline"],
core:`<p><b>Inventory fields:</b> asset ID, type and function, vendor and model, firmware and software versions, network addresses, location, zone, owner, criticality and support status.</p><p><b>Methods.</b> Passive monitoring of mirrored traffic identifies devices and protocols with no impact on the process. Safe active queries use vendor-supported protocols at low rates during agreed windows. Configuration exports and walkdowns catch serial and isolated devices that the network never shows.</p><p><b>Baselining.</b> Record who talks to whom, with which protocols and how often. Deviations become alerts and review items.</p><h2>Security implications</h2><p>Unknown assets are unpatched, unmonitored and unowned. Stale spreadsheets give false confidence.</p><h2>Common mistakes</h2><p>Running a generic scanner against live controllers, and building inventory once without a process to keep it current.</p>`,
exp:"Tie inventory to change management so new devices must be registered. Criticality should come from process consequence, not from IT importance.",
quiz:[["The safest first discovery method is:",["Aggressive scan","Passive monitoring","Reboots","Guessing"],1,"It observes traffic without sending packets to devices."],["Why include owner and criticality?",["For billing","To prioritize and assign accountability","For logos","Not needed"],1,"Decisions and responsibility depend on them."],["What does a baseline enable?",["Faster CPUs","Detection of unusual communication","Encryption","Licensing"],1,"Known normal makes deviations visible."]],
ex:"Design an inventory template with at least twelve fields. Fill it for five assets and flag two data gaps."},
"2-6":{why:"Hardening, patching and backup decide how much damage a compromise or failure can do and how quickly operations resume.",
obj:["Apply a hardening baseline to OT hosts","Run a risk-based patch decision process","Design backups that support real recovery"],
core:`<p><b>Hardening.</b> Remove or disable unused services and ports, change defaults, restrict accounts, disable autorun, control removable media and set secure configurations after vendor approval.</p><p><b>Patching.</b> Triage vulnerabilities by exposure, consequence and exploitability. Confirm vendor compatibility, test, then deploy in a planned outage. Where patching is impractical, use compensating controls such as segmentation, virtual patching at the network layer and monitoring.</p><p><b>Backup.</b> Cover controller programs, HMI and SCADA projects, historian data, network device configurations and golden images. Keep offline or immutable copies, document the restore order and test restores regularly.</p><h2>Security implications</h2><p>Ransomware recovery often fails because backups were online, untested or missing controller logic.</p><h2>Common mistakes</h2><p>Treating a successful backup job as a successful restore, and applying IT patch cadence without vendor validation.</p>`,
exp:"Define recovery time and recovery point by process, then prove them with a restore test. A documented compensating control is better than a silently skipped patch.",
quiz:[["What proves a backup works?",["A green job status","A tested restore","Large size","Encryption"],1,"Only a restore test confirms usability."],["If a patch cannot be applied, you should:",["Ignore it","Document and apply compensating controls","Remove monitoring","Disconnect safety"],1,"Risk stays visible and reduced."],["Backups should include:",["Only servers","Controller logic and configurations","Only email","Nothing offline"],1,"Logic and configs are needed to rebuild the process."]],
ex:"Create a recovery inventory for one plant area: assets, backup type, location, last restore test and restore owner. Highlight any gaps."},
"2-7":{why:"Weak identity practices make every other control easier to bypass, and OT often has shared or default accounts.",
obj:["Describe role-based access for OT","Handle shared and local accounts responsibly","Place MFA and privileged access where they help"],
core:`<p>Aim for unique accounts, roles tied to job functions (operator, engineer, maintenance, vendor), least privilege and prompt removal of leavers. Some devices support only shared local accounts or no authentication. Then compensate with physical control, network restriction, credential vaulting and logging of use.</p><p>MFA belongs at the remote access boundary and on privileged sessions to servers and engineering workstations. Operator consoles may need fast, safe access in emergencies, so use controlled alternatives such as role-based station logins or physical access control rather than blocking operators.</p><p>Privileged access management vaults and rotates administrator credentials and records sessions.</p><h2>Security implications</h2><p>Reused credentials between IT and OT turn an enterprise breach into a plant breach.</p><h2>Common mistakes</h2><p>Locking out operators during an alarm, and keeping default or never-rotated passwords because the device is hard to change.</p>`,
exp:"Design emergency access in advance. A control that can block safe operation will be bypassed, so plan the exception path with operations.",
quiz:[["Best place for MFA first:",["Remote and privileged access","Every HMI keystroke","Nowhere","Printers"],0,"It protects high-risk entry without hindering operators."],["Shared accounts require:",["Nothing","Compensating controls such as vaulting and logging","Deletion","Wifi"],1,"Accountability must be restored by other means."],["Reusing IT credentials in OT:",["Is fine","Spreads a breach into OT","Improves safety","Is required"],1,"It lets stolen IT credentials open OT systems."]],
ex:"Define four OT roles, the systems each may access, and the approval and review process for each. Add one emergency access procedure."},
"2-8":{why:"A structured assessment turns opinions into evidence-based findings that engineering and management can act on.",
obj:["Follow the ten-step assessment lifecycle","Distinguish control existence, design, implementation and effectiveness","Write a clear finding"],
core:`<p><b>Lifecycle:</b> scope and plan, identify stakeholders, inventory and criticality, collect evidence, interview and review, test controls, analyze risk, develop findings, report and prioritize, plan and validate remediation.</p><div class="scroll"><table><tr><th>Question</th><th>Example for a firewall rule set</th></tr><tr><td>Existence</td><td>Does a firewall exist?</td></tr><tr><td>Design</td><td>Is the rule policy appropriate to the zone model?</td></tr><tr><td>Implementation</td><td>Are the deployed rules the designed rules?</td></tr><tr><td>Operating effectiveness</td><td>Are changes reviewed and traffic logged over time?</td></tr></table></div><p>A finding states the condition, criteria, cause, consequence, evidence and recommendation, with a risk rating.</p><h2>Common mistakes</h2><p>Accepting a policy as proof of practice, collecting no evidence, and ranking findings without considering process consequence.</p>`,
exp:"Evidence beats assertions. Sample enough to support the conclusion and state limits of what you tested, especially in live OT where active testing is constrained.",
quiz:[["A policy exists but is not followed. Which level fails?",["Existence","Implementation or effectiveness","None","Design only"],1,"The control exists but does not operate as intended."],["A good finding includes:",["Opinion only","Condition, criteria, cause, consequence, evidence","Blame","Vendor names"],1,"These elements make it actionable and defensible."],["Step before control testing:",["Reporting","Evidence collection and interviews","Remediation validation","Closure"],1,"Testing follows understanding the environment."]],
ex:"Run a mini gap assessment of remote access using the four control questions. Write two findings in the format above."},
"2-9":{why:"Standards give shared structure for programs and requirements, but you must know what each is for and when it applies.",
obj:["Explain the roles of ISA/IEC 62443 and NIST SP 800-82","Name the 62443 foundational requirements and security levels","Separate guidance from legal obligation"],
core:`<p><b>ISA/IEC 62443</b> is a series for industrial automation and control systems. In outline: 62443-1-1 sets concepts and models; 2-1 covers security program requirements for asset owners; 2-4 covers service providers; 3-2 covers security risk assessment and system design (zones and conduits); 3-3 covers system security requirements and security levels; 4-1 covers secure product development lifecycle; 4-2 covers technical requirements for components.</p><p>The seven <b>foundational requirements</b> are identification and authentication control, use control, system integrity, data confidentiality, restricted data flow, timely response to events and resource availability. <b>Security levels</b> (SL 1 to 4) describe increasing protection against more capable attackers.</p><p><b>NIST SP 800-82</b> is guidance for securing OT, now in its third revision. NIST CSF 2.0 organizes outcomes under six functions: Govern, Identify, Protect, Detect, Respond and Recover.</p><h2>Common mistakes</h2><p>Calling a framework mandatory without checking jurisdiction and contract, and certifying against selected parts while describing it as full compliance.</p>`,
exp:"Use frameworks as a structure for your assessment and roadmap. Check the exact edition and clause before citing; the Standards and sources page shows what has been verified.",
quiz:[["Which part covers zones and conduits risk work?",["4-1","3-2","2-4","1-1"],1,"62443-3-2 addresses risk assessment and system design."],["CSF 2.0 added which function?",["Govern","Quantify","Encrypt","Patch"],0,"Govern joined the original five functions."],["Is 62443 automatically a legal requirement?",["Yes everywhere","No, depends on jurisdiction or contract","Only in IT","Always"],1,"Applicability must be confirmed."]],
ex:"Map five controls from modules 2.1 to 2.7 to a 62443 foundational requirement and a CSF function."},
"2-10":{why:"Detection, response and risk assessment complete the loop: you need to see problems, act safely and prioritize work by consequence. This module closes Level 2.",
obj:["Describe passive monitoring and useful log sources","Outline the incident response lifecycle for OT","Rate a simple risk using likelihood and consequence"],
core:`<p><b>Monitoring.</b> Passive network sensors on mirrored traffic reveal assets, protocols and changes. Combine with logs from firewalls, jump servers, domain controllers and engineering workstations, with synchronized time.</p><p><b>Response.</b> NIST SP 800-61 Rev. 3 (April 2025) frames incident response around the CSF 2.0 functions and replaces the four-phase lifecycle of Rev. 2. The core activities stay the same: prepare, detect and analyze, contain, eradicate and recover, and learn. OT adjustments: involve operations early, understand the safety impact of isolating a segment, and prefer controlled degradation to a hard cut-off.</p><p><b>Risk.</b> Rate likelihood and consequence, with safety and environmental impact weighted highest. Use a consistent scale, for example 1 to 5 each, and record assumptions.</p><h2>Common mistakes</h2><p>Pulling the network plug without checking whether the process needs it, and rating risk from IT impact alone.</p>`,
exp:"Agree decision rights before an incident: who can isolate a zone, who consults safety, and what the fallback is. Practice it in tabletop exercises.",
quiz:[["First contact in an OT incident should include:",["Only IT","Operations and engineering","Press","Vendors only"],1,"They understand the process impact of any action."],["Passive monitoring uses:",["Active scans","Mirrored traffic","Reboots","Agents on PLCs"],1,"It observes without touching devices."],["Risk weighting in OT puts highest:",["Cost","Safety and environment","Brand","Speed"],1,"Harm to people and environment outranks other impacts."]],
ex:"Level 2 completion: finish all ten modules, score at least 80 percent on knowledge checks, produce a conduit table, a remote access audit with five findings, and one rated risk entry. Then mark modules complete."}
});
Object.assign(BODY,{
"3-1":{why:"Firewall and architecture reviews find the paths an attacker would actually use, which often differ from the approved diagram.",
obj:["Review a firewall rule base against a zone model","Trace real paths between levels and find bypasses","Write findings with evidence"],
core:`<p><b>Method.</b> Collect the rule base, the zone and conduit design and a traffic baseline. Compare intended flows with allowed flows, then with observed flows. Walk the network for paths the design does not show: dual-homed hosts, modems, cellular routers, wireless bridges and vendor laptops.</p><div class="scroll"><table><tr><th>Sample rule</th><th>Finding</th></tr><tr><td>IT net to PLC net, any service, allow</td><td>Bypasses the DMZ and permits control protocols from IT; replace with brokered, port-specific flows</td></tr><tr><td>OT net to internet, any, allow</td><td>No business need identified; allows command and control and exfiltration</td></tr><tr><td>Rule with no owner and no hits in a year</td><td>Candidate for removal after owner review</td></tr><tr><td>Rule shadowed by an earlier broad allow</td><td>Never evaluated; indicates weak change control</td></tr></table></div><h2>Security implications</h2><p>Check default deny, logging, management plane exposure, administrator accounts and who can change rules. A well-designed rule base that nobody reviews decays within a year.</p><h2>Common mistakes</h2><p>Reviewing rules without hit counts or traffic data, and trusting the diagram instead of walking the network.</p>`,
exp:"Every allow rule should have an owner, a business reason, a review date and a specific source, destination and service. Rules that cannot be justified are findings.",
quiz:[["Hit counts help you find:",["Unused or shadowed rules","Faster CPUs","Zero days","Licenses"],0,"Rules with no hits are candidates for review or removal."],["An undocumented cellular router in a cabinet is:",["Fine","An unmanaged path around the architecture","A backup","Required"],1,"It bypasses controls the diagram assumes."],["Strong rules have:",["Any any","Owner, justification, specific scope","No logs","Wide ranges"],1,"Specific, owned and reviewed."]],
ex:"Given a ten-rule table, mark each as keep, tighten or remove, and write three formal findings with recommended fixes."},
"3-2":{why:"Advanced environments mix many protocols, and each has its own trust model and monitoring needs.",
obj:["Compare security features across eight protocol families","Identify the highest-risk default configurations","Choose controls that fit each protocol"],
core:`<div class="scroll"><table><tr><th>Protocol</th><th>Use and model</th><th>Security notes</th></tr><tr><td>IEC 61850</td><td>Substations; MMS client-server (TCP 102), GOOSE and Sampled Values multicast on layer 2</td><td>GOOSE is typically unauthenticated; IEC 62351 defines protections, deployment varies</td></tr><tr><td>OPC UA</td><td>Client-server and publish-subscribe, default port 4840</td><td>Security modes None, Sign, SignAndEncrypt with X.509 certificates; risk is mode None and poor trust list management</td></tr><tr><td>MQTT</td><td>Broker based publish-subscribe, 1883 plain, 8883 TLS</td><td>Open brokers and missing topic access control are common problems</td></tr><tr><td>BACnet</td><td>Building automation, UDP 47808</td><td>Classic BACnet lacks strong security; BACnet/SC uses TLS</td></tr><tr><td>HART and WirelessHART</td><td>Digital data over 4 to 20 mA loops; wireless mesh</td><td>WirelessHART uses encryption and join keys; wired HART relies on physical access</td></tr><tr><td>Foundation Fieldbus</td><td>H1 field network, HSE on Ethernet</td><td>Limited native security; protect physically and at gateways</td></tr><tr><td>SNMP</td><td>Device management, UDP 161 and 162</td><td>v1 and v2c use cleartext community strings; use v3</td></tr><tr><td>NTP and PTP</td><td>Time, NTP UDP 123, PTP IEEE 1588</td><td>Time manipulation affects logs, authentication and event sequencing; authenticate sources</td></tr></table></div><h2>Common mistakes</h2><p>Leaving OPC UA security mode at None because it connects, enabling SNMP defaults, and using unsynchronized clocks across zones.</p>`,
exp:"Separate what the protocol can do from what the vendor implemented and what the site enabled. Verify in device configs and captures.",
quiz:[["OPC UA risk mode is:",["SignAndEncrypt","None","Sign","X.509"],1,"Mode None gives no protection."],["SNMP v2c uses:",["Cleartext community strings","Kerberos","TLS","Smart cards"],0,"Use v3 for authentication and privacy."],["Why does time sync matter for security?",["Pretty clocks","Log correlation and certificate validation depend on it","Licensing","Speed"],1,"Wrong time breaks forensics and some authentication."]],
ex:"Build a comparison matrix of these eight protocols with columns for authentication, encryption, monitoring approach and top control."},
"3-3":{why:"Packet analysis turns observation into evidence and teaches you what protocols actually do on the wire.",
obj:["Capture OT traffic safely","Read Modbus function codes in a capture","Spot anomalies against a baseline"],
core:`<p><b>Capture safely.</b> Use a SPAN port or network tap and a dedicated analysis host. Never install capture tools on controllers or live HMIs. Hash capture files and record when and where you captured them.</p><p><b>Useful Wireshark display filters:</b> <code>tcp.port == 502</code>, <code>modbus.func_code == 16</code>, <code>enip</code>, <code>dnp3</code>. Check conversations by endpoint and function code.</p><div class="scroll"><table><tr><th>Time</th><th>Source</th><th>Destination</th><th>Request</th></tr><tr><td>10:01:00</td><td>10.1.2.5 (HMI)</td><td>10.1.3.10 (PLC)</td><td>Function 3, read holding registers, every second</td></tr><tr><td>10:01:01</td><td>10.1.2.5 (HMI)</td><td>10.1.3.10 (PLC)</td><td>Function 3, read holding registers</td></tr><tr><td>10:07:12</td><td>10.1.9.44 (unknown)</td><td>10.1.3.10 (PLC)</td><td>Function 16, write multiple registers, address 40001, count 8</td></tr></table></div><h2>Security implications</h2><p>New clients, write function codes, diagnostic functions and changes in polling rate are all worth review. Capture alone shows what happened, not whether it was authorized.</p><h2>Common mistakes</h2><p>Mirroring too much traffic and dropping packets, and drawing conclusions without checking the change calendar.</p>`,
exp:"Build the baseline first. Experts check who, what, when and authorization before calling anything malicious.",
quiz:[["Where should capture tools run?",["On the PLC","On a dedicated host fed by a tap or SPAN","On the HMI","On safety"],1,"It avoids touching production devices."],["Which request in the table is anomalous?",["Polling from the HMI","The write from an unknown host","Neither","Both"],1,"A new source issuing a write is the deviation."],["Why hash capture files?",["Speed","Evidence integrity","Color","Size"],1,"Hashes show the file was not altered."]],
ex:"Write three alert rules for the capture above, each with the condition, the data source and the likely false positive."},
"3-4":{why:"Understanding adversary behavior in a common vocabulary lets you map attacks to detections and controls.",
obj:["Describe the stages of an ICS intrusion","Map observed behavior to ATT&CK for ICS","Recognize living-off-the-land activity"],
core:`<p>Industrial intrusions often have two phases: gaining access to IT and pivoting, then developing and executing an attack on the process. Attackers use stolen credentials, remote access, native administration tools and legitimate engineering software, which avoids malware signatures.</p><p><b>Mapping method.</b> Describe the observed behavior in plain words, find the matching technique in ATT&CK for ICS, then record the tactic, the data sources that would reveal it and the control that limits it. Examples of technique names: Unauthorized Command Message, Block Command Message, Manipulation of View, Loss of View, Spoof Reporting Message. Confirm technique names and IDs against the current ATT&CK matrix before citing them.</p><h2>Security implications</h2><p>Defenders should expect early stages in IT and design detection at the boundaries: remote access, jump servers, engineering workstations and controller changes.</p><h2>Common mistakes</h2><p>Mapping to the most dramatic technique, ignoring early stages, and treating the matrix as a coverage score.</p>`,
exp:"A useful mapping ends in an action: a log source to collect, a rule to add or a control to test.",
quiz:[["Living off the land means:",["Custom malware only","Using legitimate tools already present","Farming","Physical theft"],1,"It reduces detection by signature tools."],["Mapping should end with:",["A score","A detection or control action","A poster","A blame list"],1,"Mapping is useful only if it drives action."],["Where do many OT attacks begin?",["Sensors","IT networks and remote access","Valves","Radio"],1,"They pivot into OT from IT."]],
ex:"Take a short scenario of a phishing email leading to HMI manipulation and map each step to a technique, a detection and a control."},
"3-5":{why:"Real incidents show how attacks work against real plants. Learn them with the facts separated from interpretation.",
obj:["Describe the attack paths of four landmark cases","Separate reported facts from analyst attribution","Draw defensive lessons"],
core:`<div class="scroll"><table><tr><th>Case</th><th>Widely reported facts</th><th>Analytical interpretation</th><th>Defensive lesson</th></tr><tr><td>Stuxnet (found 2010)</td><td>Windows worm spread by USB and network, used several zero-day flaws and stolen code-signing certificates, modified Siemens PLC logic and masked it from operators; reported target was Iranian uranium enrichment centrifuges</td><td>Attribution to state actors is widely reported but not officially confirmed by those governments</td><td>Removable media control, engineering workstation protection, integrity checks of PLC logic, independent process monitoring</td></tr><tr><td>Havex (2014)</td><td>Remote access trojan delivered through trojanized installers on vendor websites, with a module that enumerated OPC servers</td><td>Linked by security researchers to an espionage group; goal assessed as reconnaissance</td><td>Software supply chain verification, OPC exposure, monitoring of outbound connections</td></tr><tr><td>Ukraine power, 2015</td><td>Spear phishing, stolen credentials, remote operation of breakers through operator interfaces, serial-to-Ethernet converter firmware overwritten, wiper use, telephone flooding; outages affected roughly 225,000 customers for hours</td><td>Government and industry analysts attributed it to a state-linked group</td><td>VPN and credential control, MFA, segmentation, manual operation procedures, device firmware integrity</td></tr><tr><td>Industroyer (2016)</td><td>Modular malware for a Ukrainian transmission substation with payloads for several grid protocols; roughly an hour of outage in part of Kyiv</td><td>Analysts linked it to the same group as 2015; a test or capability demonstration is debated</td><td>Protocol-aware monitoring, segmentation of substation networks, protective relay settings review</td></tr></table></div><p>Details come from public analyses and government reports at summary level; confirm specifics against primary sources before formal use.</p><h2>Common mistakes</h2><p>Treating attribution as fact, and learning only the malware instead of the access path that enabled it.</p>`,
exp:"The enduring lessons are about access, credentials, segmentation and recovery. Malware changes; these controls do not.",
quiz:[["Stuxnet masked its changes by:",["Deleting logs only","Showing operators normal values","Shutting the plant","Email"],1,"It hid the manipulation from the operator view."],["Havex was notable for:",["Ransomware","Trojanized vendor installers with OPC scanning","Wiper","SCADA hardware"],1,"It combined supply chain delivery with industrial reconnaissance."],["Attribution should be treated as:",["Certain","Analytical judgment with stated confidence","Irrelevant","Proof"],1,"Public reporting usually shows confidence levels, not proof."]],
ex:"For one case, write the attack path in six steps, mark each as confirmed or interpreted, and name one detection and one control per step."},
"3-6":{why:"Identity services are central to OT access, and Active Directory failures can stop operations.",
obj:["Design Active Directory for OT","Use privileged access management","Plan authentication that survives outages"],
core:`<p>Options for Active Directory in OT include a separate OT forest or domain, a resource forest with limited trust, or a shared enterprise domain. Separation limits blast radius but needs its own administration. Place domain controllers at the site so authentication works when the WAN fails, and keep local fallback accounts for operations under controlled custody.</p><p>Use tiered administration: no domain administrator logons on engineering workstations or HMIs. Privileged access management vaults and rotates administrator credentials, brokers sessions and records activity. MFA suits jump servers, remote access and privileged logons; operator consoles often use role-based station accounts and physical access control.</p><h2>Common mistakes</h2><p>Single enterprise AD with no local fallback, shared domain admin accounts, and service accounts with unlimited rights and never-rotated passwords.</p>`,
exp:"Design for the failure case first: what happens at the console if the directory is unavailable during an alarm?",
quiz:[["A site domain controller helps because:",["It is cheaper","Authentication works during WAN loss","It is faster at logging","It stores PLC code"],1,"It keeps local authentication available."],["Tiering means:",["Admin logons on all hosts","Separating admin credentials by trust level","No admins","One account"],1,"It stops high-privilege credentials from sitting on exposed hosts."],["PAM provides:",["Vaulting, rotation, session control","Faster CPUs","VLANs","Patches"],0,"It limits and records privileged use."]],
ex:"Sketch an identity design for two plants and a central site, including DC placement, trust, fallback accounts and where MFA applies."},
"3-7":{why:"Endpoints in OT are often old, fixed in function and tightly tied to vendor support, so standard IT endpoint approaches need adapting.",
obj:["Choose allowlisting, antivirus and EDR approaches for OT hosts","Control removable media","Assess virtualization and container risk"],
core:`<p><b>Application allowlisting</b> suits static HMIs and engineering stations: only approved executables run. <b>Antivirus</b> should be vendor-validated with exclusions for process files and scan schedules that avoid peak load. <b>EDR</b> requires testing for CPU and memory impact and vendor support; where agents are not supported, rely on network monitoring and host logging.</p><p><b>Removable media:</b> disable autorun, restrict ports, use scanning kiosks and approved devices. <b>Virtualization</b> consolidates servers and simplifies recovery, but hypervisor management networks must be isolated, resource contention can hurt determinism and vendor support must be confirmed. Containers at the edge need image provenance, patching and network policy.</p><h2>Common mistakes</h2><p>Installing agents without vendor approval, scanning during production peaks and mixing IT and OT workloads on one hypervisor cluster.</p>`,
exp:"Choose the control per host type: fixed-function hosts get allowlisting, general servers get EDR where supported, devices get network protection.",
quiz:[["Best fit for allowlisting:",["Email servers","Static HMIs","Laptops","Phones"],1,"Fixed function means a stable approved software list."],["A virtualization risk in OT is:",["None","Resource contention and management exposure","Color","Wi-Fi"],1,"Shared resources can break timing and management planes are targets."],["Before EDR on an HMI you need:",["Nothing","Vendor support and performance testing","A holiday","A reboot"],1,"Unsupported agents can break validated systems."]],
ex:"Build a table of five host types with the chosen endpoint control, reason, and the verification test for each."},
"3-8":{why:"Technical assessment shows whether controls work in practice, without harming the process.",
obj:["Select safe assessment methods","Test control effectiveness with evidence","Set rules of engagement and stop conditions"],
core:`<p><b>Methods in safe-to-risky order:</b> document and configuration review, passive traffic analysis, authenticated read-only checks of hosts, testing in an offline lab or on a spare device, and active testing on production only under strict rules.</p><p><b>Control tests.</b> Verify a firewall rule by observing traffic, check account removal by reviewing a leaver list against the directory, prove backups by restoring in a lab, and check allowlisting by attempting an approved test file in a lab.</p><p><b>Rules of engagement:</b> written scope, approved windows, named contacts, stop conditions, rollback plan and an operations observer.</p><h2>Common mistakes</h2><p>Running vulnerability scanners on live controllers, and testing without a way to stop immediately.</p>`,
exp:"State what you did not test and why. In OT, a clear limitation is more credible than an unsafe test.",
quiz:[["Safest first method:",["Exploit testing","Document and configuration review","Fuzzing","DoS"],1,"It has no process impact."],["Stop conditions exist to:",["Save time","Halt testing on any sign of process impact","Annoy teams","Cut costs"],1,"They protect safety and availability."],["Where should active exploit testing happen?",["Production first","Lab or test bench","Safety systems","Remote sites"],1,"A lab avoids any operational risk."]],
ex:"Write rules of engagement for a read-only assessment of a water plant HMI network, with scope, windows, contacts and stop conditions."},
"3-9":{why:"Detection that matches how OT attacks unfold, and that operations trusts, is the basis of an OT security monitoring capability.",
obj:["Design OT detection use cases","Describe a monitoring data pipeline","Tune alerts using operational context"],
core:`<p><b>Pipeline:</b> sensors and logs, collectors, normalization, correlation in a SIEM, case handling and response. Time synchronization is required.</p><p><b>Starter use cases:</b> new device on an OT segment, write command from a non-engineering host, controller firmware or logic download outside a maintenance window, controller mode change to program, remote session without an approved ticket, off-hours logon to an engineering workstation, and first-time communication between zones.</p><p>Test each rule with replayed traffic in a lab, record expected false positives and review precision monthly.</p><h2>Common mistakes</h2><p>Importing IT rules unchanged, alert floods that operations stops reading and no owner for tuning.</p>`,
exp:"Enrich alerts with change tickets and maintenance calendars. Many OT alerts are benign work; context is what separates them.",
quiz:[["Strong OT use case:",["Any DNS lookup","Logic download outside maintenance window","Fan speed","Printer jam"],1,"It is rare, high impact and easy to validate."],["Tuning requires:",["Context from operations","Random thresholds","Disabling alerts","Larger logs"],0,"Operational knowledge identifies legitimate activity."],["Why test rules with replay?",["For fun","To validate detection before production","To save disk","Compliance only"],1,"It shows whether the rule works and how noisy it is."]],
ex:"Write five detection use cases with data source, logic, expected false positive and response action."},
"3-10":{why:"OT incident response must protect safety and production while containing the threat. This module closes Level 3.",
obj:["Classify and escalate OT incidents","Choose containment options with process impact in mind","Preserve evidence and recover from known-good states"],
core:`${chain(["Detect and triage","Notify operations and safety","Assess process impact","Contain: isolate access path or segment","Preserve evidence","Eradicate and restore from known good","Validate with engineering, then reconnect","Lessons learned"],[3],"OT incident response flow")}<p>Prefer targeted containment, such as disabling a remote access account or blocking a conduit at the DMZ, before shutting a segment. Know in advance which areas can run in local or manual control. Preserve logs, configuration exports and memory where safe; do not power-cycle devices to collect evidence unless operations agree. Restore from verified backups and validate logic against a known-good copy before reconnecting.</p><h2>Common mistakes</h2><p>Cutting connectivity before understanding the process effect, losing volatile evidence and restoring from compromised backups.</p>`,
exp:"Decision rights, manual operating procedures and tested restores decide the outcome, so rehearse them.",
quiz:[["A preferred first containment is:",["Plant shutdown","Targeted block of access path","Format all","Ignore"],1,"It limits process disruption."],["Before reconnecting restored systems you should:",["Hope","Validate configs and logic against known-good","Delete logs","Add users"],1,"It avoids reintroducing compromise."],["Evidence collection must:",["Disrupt the process","Be coordinated with operations","Wait for a year","Be skipped"],1,"Safe collection depends on process state."]],
ex:"Level 3 completion: finish all ten modules, score at least 80 percent on knowledge checks, complete a firewall review with three findings, a packet analysis write-up and a one-page incident response decision guide. Then mark modules complete."}
});
Object.assign(BODY,{
"4-1":{why:"Risk-based zone design is the core method of IEC 62443 and the skill that separates architects from checklist followers.",
obj:["Apply the 62443-3-2 risk assessment sequence","Partition a system into zones and conduits","Derive target security levels from risk"],
core:`<p>IEC 62443-3-2 describes how to assess and design for security risk in an industrial automation and control system. In outline:</p><ol><li><b>Define the system under consideration (SUC)</b> and its boundary, including connections.</li><li><b>Run an initial high-level risk assessment</b> using worst-case consequence (safety, environment, financial, operational) to set the tolerable risk.</li><li><b>Partition into zones and conduits</b> by function, consequence, criticality and communication.</li><li><b>Compare risk with tolerable risk</b> for each zone and conduit. If it is too high, run a detailed assessment of threats, vulnerabilities, likelihood and consequence.</li><li><b>Assign a target security level (SL-T)</b> and select countermeasures; document the cybersecurity requirements specification and obtain asset owner approval.</li></ol><p>SL-T is the level required, SL-C is the capability a component or system can provide, and SL-A is the level achieved in operation. The goal is SL-A meeting SL-T.</p><h2>Security implications</h2><p>High-consequence zones, such as the safety zone, warrant stricter targets and tighter conduits than a historian zone.</p><h2>Common mistakes</h2><p>Setting every zone to the same SL, rating consequence from IT impact, and producing documents with no link to engineering drawings.</p>`,
exp:"The value is the traceability from consequence to zone to requirement. Keep the SUC diagram, zone table and conduit table synchronized with engineering records.",
quiz:[["SL-A is:",["Target","Capability","Achieved level in operation","A license"],2,"It describes what the deployed system actually delivers."],["Zones are partitioned by:",["Function, consequence and communication","Brand","IP only","Budget"],0,"Shared risk and role define a zone."],["Who approves the requirements?",["Vendor only","Asset owner","Auditor only","Nobody"],1,"The asset owner accepts the risk and the plan."]],
ex:"Take a described plant with 12 assets. Draw the SUC, define four zones with consequence ratings, assign SL-T values and justify each."},
"4-2":{why:"Requirement documents let you specify, procure and verify security in systems and products.",
obj:["Explain how 3-3, 4-1 and 4-2 relate","Use requirements and enhancements by security level","Write security clauses for procurement"],
core:`<p><b>62443-3-3</b> defines system security requirements (SRs) grouped by the seven foundational requirements, with requirement enhancements that apply at higher security levels. <b>62443-4-2</b> defines component requirements for devices, software and hosts. <b>62443-4-1</b> defines the secure product development lifecycle a supplier follows: security requirements, design, implementation, verification, defect and patch management, and end-of-life.</p><p><b>Use in practice.</b> Specify target levels in tenders, require supplier evidence of a development lifecycle and component capability, and verify at factory and site acceptance testing. Certification schemes exist for products and processes, and their scope must be read carefully before relying on them.</p><h2>Security implications</h2><p>Buying components with weak capability means compensating in the architecture for decades.</p><h2>Common mistakes</h2><p>Accepting a certificate without checking which version and level it covers, and writing requirements nobody tests.</p>`,
exp:"Evidence expected in an assessment: supplier lifecycle artifacts, component test reports, FAT and SAT records and configuration evidence. Verify editions before citing clauses; the Standards and sources page shows verification status.",
quiz:[["Which part covers supplier development lifecycle?",["3-3","4-1","2-1","1-1"],1,"62443-4-1 addresses secure product development."],["Component requirements are in:",["4-2","3-2","2-4","1-1"],0,"4-2 defines technical requirements for components."],["Certificates should be:",["Trusted blindly","Checked for scope, version and level","Ignored","Framed"],1,"Scope determines what the claim means."]],
ex:"Write eight security clauses for a PLC tender and the test you would run at FAT and SAT for each."},
"4-3":{why:"Architecture is where security becomes durable. Good design reduces the number of controls that must be operated perfectly.",
obj:["Design a multi-site segmented architecture","Balance resilience and security","Document and defend design decisions"],
core:`${chain(["Enterprise IT and cloud services","Central security services (SOC, identity, patching)","Regional connectivity with firewalls and encrypted links","Site industrial DMZ","Site operations zone","Control zones and safety zone"],[1,3],"Multi-site OT architecture")}<p><b>Principles.</b> Each site runs independently if central services fail; central services provide monitoring, identity and updates through brokered flows; the safety zone has the most restrictive conduits; remote access is centralized and recorded; data leaves OT through outbound-only or unidirectional paths where the process allows.</p><p><b>Decision records.</b> For every major choice (site-local versus central identity, unidirectional versus brokered data exchange, redundancy design) document options, consequences and the risk accepted.</p><h2>Common mistakes</h2><p>Central dependencies that stop a site when the WAN drops, security tools with write access to control networks, and inconsistent designs across sites.</p>`,
exp:"Standardize a site template, then manage exceptions. Consistency makes monitoring, assessment and recovery cheaper.",
quiz:[["Site independence means:",["No security","Site operates if central services fail","No WAN","No monitoring"],1,"It prevents central outages from stopping production."],["Central monitoring tools should have:",["Write access to PLCs","Read-only, brokered visibility","Admin on safety","Open inbound"],1,"Visibility should not create new control paths."],["Why keep decision records?",["Habit","Traceable reasoning and accepted risk","Art","Fees"],1,"They make design defensible and reviewable."]],
ex:"Design the architecture for three plants and a head office. Specify zones, conduits, remote access, identity, monitoring and recovery, with one decision record."},
"4-4":{why:"These cases show attacks reaching safety systems, protocol-level manipulation and modular tooling built for many vendors.",
obj:["Analyze four advanced cases","Separate reported facts from interpretation","Derive architecture and detection lessons"],
core:`<div class="scroll"><table><tr><th>Case</th><th>Widely reported facts</th><th>Interpretation</th><th>Lessons</th></tr><tr><td>TRITON (2017)</td><td>Malware targeted Triconex safety controllers at an industrial facility in the Middle East; a fault in the attack caused a safety shutdown that exposed it; attackers had reached the engineering workstation from IT</td><td>Government statements and analysts linked it to a state-affiliated research institute; intent to cause physical harm is assessed, not proven</td><td>Isolate the SIS, keep controllers out of program mode, monitor engineering workstations, control logic changes</td></tr><tr><td>Industroyer2 (2022)</td><td>Malware targeting IEC 104 communications at a Ukrainian energy company, reported as detected before the planned effect, alongside a wiper</td><td>Attributed by analysts and the Ukrainian CERT to the group linked to 2015 and 2016 attacks</td><td>Protocol-aware detection, tested recovery, hardening of substation gateways</td></tr><tr><td>PIPEDREAM / INCONTROLLER (disclosed 2022)</td><td>Government and vendor advisories described a modular toolkit for several PLC families, OPC UA servers and engineering software; no destructive use was reported at disclosure</td><td>Assessed as developed by a state-sponsored actor for disruption capability</td><td>Inventory exposed engineering interfaces, restrict engineering protocols, monitor program and mode changes</td></tr><tr><td>FrostyGoop (reported 2024)</td><td>Malware sending Modbus TCP commands to controllers was reported in an attack on a Ukrainian district heating provider, leaving many buildings without heat for about two days</td><td>Initial access details and attribution are less settled in public sources, and the scale and duration of the outage are disputed in some analyses</td><td>Segment Modbus devices, restrict internet-exposed devices, validate recovery for heating or utility services</td></tr></table></div><p>Specific numbers and dates are summary-level and should be confirmed against vendor and government sources before formal use.</p><h2>Common mistakes</h2><p>Concluding that exotic tools were required, when access to IT and weak boundaries enabled each case.</p>`,
exp:"Safety systems are targets because they are the last barrier. Treat engineering workstations and logic changes as the crown jewels.",
quiz:[["TRITON targeted:",["Email","A safety instrumented system","Printers","Cameras"],1,"It focused on safety controllers."],["Industroyer2 focused on which protocol?",["Modbus","IEC 104","DNP3","MQTT"],1,"It was built to speak IEC 60870-5-104."],["PIPEDREAM was reported as:",["A single exploit","A modular multi-vendor toolkit","Ransomware","Hardware"],1,"It combined components for several device types."]],
ex:"Choose two cases. Build a control-gap table: attack step, missing control, detection and architecture fix."},
"4-5":{why:"Leading assessments means turning evidence into decisions. Reports are the product you leave behind.",
obj:["Plan and lead an assessment team","Structure findings and reports for different audiences","Build a prioritized remediation roadmap"],
core:`<p><b>Leadership.</b> Set scope with the asset owner, agree rules of engagement, assign evidence owners, track requests and hold daily check-ins with operations. Record every limitation.</p><p><b>Reporting.</b> An executive summary states overall posture, the top risks in business and safety terms and decisions needed. The technical body lists findings with evidence, rating, root cause and fix. Appendices hold method, scope and evidence references.</p><p><b>Prioritization.</b> Rank by consequence and likelihood, then by effort and dependency. Present a roadmap in horizons: immediate risk reduction, near-term program build, long-term architecture change, each with owners and validation criteria.</p><h2>Common mistakes</h2><p>Long finding lists with no ranking, recommendations that need outages without a plan, and no validation step.</p>`,
exp:"Agree the finding wording with the technical owner before the report reaches management. Surprises damage trust and delay fixes.",
quiz:[["An executive summary should lead with:",["Packet details","Top risks and decisions","Tool names","Appendix"],1,"Leaders need risk and decisions."],["A roadmap needs:",["Owners and validation","Colors","Quotes","Nothing"],0,"Without owners it will not happen."],["Before issuing a report you should:",["Surprise the owners","Review findings with technical owners","Hide limits","Skip evidence"],1,"Factual review prevents errors and disputes."]],
ex:"From ten sample findings write an executive summary of under 250 words and a three-horizon roadmap."},
"4-6":{why:"An OT SOC succeeds when it combines security skills with process knowledge and clear decision paths.",
obj:["Compare OT SOC operating models","Define roles, playbooks and handoffs","Select metrics"],
core:`<p><b>Models.</b> IT SOC with OT specialists, a fused SOC with shared tooling and OT escalation, a dedicated OT SOC at site or region, or a managed service with site liaison. Smaller organizations often start fused with on-call plant engineers.</p><p><b>Design elements.</b> Sensors and log sources by zone, case management, playbooks for OT-specific alerts, agreed authority to contain, shift coverage, training for process basics and a link to engineering change records.</p><p><b>Metrics.</b> Coverage of critical zones, time to detect and triage, false positive rate, exercise results and closure of findings.</p><h2>Common mistakes</h2><p>Staffing only IT analysts, building dashboards without response authority, and sending sensitive OT data to external services without review.</p>`,
exp:"The hardest part is the handoff to operations. Define who decides, how fast and with what fallback.",
quiz:[["A fused SOC:",["Is only IT","Shares tooling with OT escalation","Has no analysts","Is hardware"],1,"It integrates IT and OT monitoring with OT expertise."],["Playbooks should include:",["Containment authority and contacts","Logos","Prices","Passwords"],0,"Authority and contacts allow fast safe action."],["A useful metric is:",["Number of screens","Time to triage","Logo size","Coffee"],1,"It shows response capability."]],
ex:"Choose a SOC model for a three-plant operator, justify it, and draft one OT playbook with roles and decision points."},
"4-7":{why:"Cloud, IIoT, edge and wireless extend OT reach and attack surface, usually faster than governance adapts.",
obj:["Design secure cloud and edge data flows","Secure wireless in industrial settings","Evaluate IIoT devices"],
